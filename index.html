<!DOCTYPE html>
<html lang="th">
<head>

<style>

   BODY
============================================================ */

body{

  background:#f4f6f9;

  padding:20px;

   CONTAINER
============================================================ */

  margin:auto;

  box-shadow:0 6px 18px rgba(0,0,0,0.08);

  margin-top:0;

   INPUT
============================================================ */

  display:flex;

}

  width:100%;

  box-sizing:border-box;

   BUTTON
============================================================ */

  padding:12px 16px;
  border:none;

  cursor:pointer;
  font-weight:bold;
  margin-right:6px;
}

.btn-blue{

  color:#fff;
}

.btn-green{
  background:#16a34a;
  color:#fff;
}

.btn-orange{
  background:#f59e0b;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

.del-btn{
  background:#ef4444;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
}


/* ============================================================
   BACKUP STATUS
============================================================ */

#backupStatus{
  margin-top:12px;
  padding:10px 12px;
  background:#f1f5f9;
  border-radius:8px;
  font-size:13px;
  color:#475569;
}

#backupStatus.ok{
  background:#dcfce7;
  color:#166534;
}

  background:#fee2e2;
  color:#991b1b;
}


/* ============================================================
   TABLE
============================================================ */

.table-container{
  margin-top:20px;
  max-height:420px;
  overflow:auto;
  border:1px solid #ddd;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border:1px solid #e5e7eb;
  padding:8px;
  font-size:13px;
  white-space:nowrap;
}

th{
  background:#f1f5f9;
  position:sticky;
  top:0;
  z-index:10;

.latest{
  background:#fff7cc;
}


/* ============================================================
   SUMMARY
============================================================ */

#summaryWrapper{
  margin-top:20px;

}

  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}


/* ============================================================
   ALERT
============================================================ */

#duplicateAlert{
  display:none;
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
}

</style>

</head>


<body>

<div class="container">

<h2>📦 INVENTORY COUNT SYSTEM</h2>


<!-- ============================================================
     SCAN INPUT
============================================================ -->

<div class="scan-row">

<select id="rowSelect"></select>

<input
  id="qrInput"
  placeholder="Scan QR Code..."
  autofocus
/>

</div>


<!-- ============================================================
     DUPLICATE ALERT
============================================================ -->

<div id="duplicateAlert">
  ⚠ Duplicate Item
</div>


<!-- ============================================================
     BUTTON
============================================================ -->

<button
  class="btn-green"
  onclick="selectBackupFolder()"
>
  📁 ตั้งค่า Backup C:
</button>


<button
  class="btn-blue"
  onclick="exportExcel()"
>
  📊 Export Excel
</button>


<button
  class="btn-red"
  onclick="clearAll()"
>
  Clear
</button>


<!-- ============================================================
     BACKUP STATUS
============================================================ -->

<div id="backupStatus">
  ⚠ ยังไม่ได้ตั้งค่าโฟลเดอร์ Backup
</div>


<!-- ============================================================
     SCAN TABLE
============================================================ -->

<div class="table-container">

<table>

<thead>

<tr>

<th>Row</th>

<th>No</th>

<th>Line</th>

<th>Location</th>

<th>Part</th>

<th>Q'ty</th>

<th>PO</th>

<th>LOT</th>

<th>Remark</th>

<th>Time</th>

<th>Action</th>

</tr>

</thead>


<tbody id="tb"></tbody>

</table>

</div>


<!-- ============================================================
     SUMMARY
============================================================ -->

<div id="summaryWrapper">

<div id="summary"></div>

</div>


</div>


<script>

/* ============================================================
   GLOBAL
============================================================ */

let data = [];

let scanned = [];

let latestRowFocus = "";


/*
   File System Access API

   ใช้สำหรับเลือก C:\ และสร้างโฟลเดอร์
   C:\Count stock
*/

let backupRootHandle = null;

let backupFolderHandle = null;


/* ============================================================
   BACKUP CONFIG
============================================================ */

const BACKUP_FOLDER_NAME = "Count stock";

const BACKUP_PREFIX = "Count stock";


/* ============================================================
   DOM
============================================================ */

const tb =
  document.getElementById("tb");

const qr =
  document.getElementById("qrInput");

const rowSelect =
  document.getElementById("rowSelect");

const backupStatus =
  document.getElementById("backupStatus");


/* ============================================================
   CREATE ROW 1 - 50
============================================================ */

for(let i = 1; i <= 50; i++){

  rowSelect.innerHTML += `
    <option value="${i}">
      Row ${i}
    </option>
  `;

}


/* ============================================================
   CHECK FILE SYSTEM API
============================================================ */

function isFileSystemAccessSupported(){

  return (
    "showDirectoryPicker" in window
  );

}


/* ============================================================
   BACKUP STATUS
============================================================ */

function setBackupStatus(
  message,
  type = ""
){

  backupStatus.textContent =
    message;

  backupStatus.className =
    type;

}


/* ============================================================
   SELECT BACKUP ROOT
     
   ผู้ใช้เลือก C: ครั้งแรก
     
   จากนั้นระบบสร้าง:
     
   C:\Count stock
     
   ถ้ามีอยู่แล้วจะใช้ของเดิม
============================================================ */

async function selectBackupFolder(){

  if(
    !isFileSystemAccessSupported()
  ){

    alert(
      "Browser นี้ไม่รองรับการเขียนไฟล์ลงโฟลเดอร์โดยตรง\n\n" +
      "แนะนำให้ใช้ Google Chrome หรือ Microsoft Edge รุ่นใหม่"
    );

    return;

  }


  try{

    /*
      เปิดหน้าต่างเลือกโฟลเดอร์
    */

    backupRootHandle =
      await window.showDirectoryPicker({
        mode:"readwrite"
      });


    /*
      ตรวจสอบสิทธิ์
    */

    const permission =
      await verifyPermission(
        backupRootHandle,
        true
      );


    if(!permission){

      setBackupStatus(
        "❌ ไม่ได้รับสิทธิ์เขียนไฟล์ Backup",
        "error"
      );

      return;

    }


    /*
      สร้าง / เปิด Count stock
    */

    backupFolderHandle =
      await backupRootHandle.getDirectoryHandle(
        BACKUP_FOLDER_NAME,
        {
          create:true
        }
      );


    /*
      เก็บสถานะใน Browser
    */

    try{

      localStorage.setItem(
        "backupFolderConfigured",
        "true"
      );

    }catch(e){}


    setBackupStatus(
      "✅ Backup พร้อมใช้งาน → " +
      BACKUP_FOLDER_NAME,
      "ok"
    );


    /*
      Backup ข้อมูลปัจจุบันทันที
      ถ้ามีข้อมูลอยู่
    */

    if(data.length > 0){

      await createBackupFile();

    }


    alert(
      "ตั้งค่า Backup สำเร็จ\n\n" +
      "ระบบจะสร้างไฟล์ในโฟลเดอร์:\n" +
      BACKUP_FOLDER_NAME
    );


  }catch(error){

    console.error(
      "Backup folder error:",
      error
    );


    setBackupStatus(
      "❌ ไม่สามารถตั้งค่า Backup ได้",
      "error"
    );

  }

}


/* ============================================================
   VERIFY PERMISSION
============================================================ */

async function verifyPermission(
  handle,
  withWrite
){

  try{

    const options = {};

    if(withWrite){

      options.mode =
        "readwrite";

    }


    if(
      (await handle.queryPermission(options))
      === "granted"
    ){

      return true;

    }


    if(
      (await handle.requestPermission(options))
      === "granted"
    ){

      return true;

    }


    return false;

  }catch(error){

    console.error(
      "Permission error:",
      error
    );

    return false;

  }

}


/* ============================================================
   GENERATE DATE
     
   YYYYMMDD
============================================================ */

function getDateString(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");


  const day =
    String(
      now.getDate()
    ).padStart(2,"0");


  return (
    year +
    month +
    day
  );

}


/* ============================================================
   GENERATE TIME
     
   HHMMSS
============================================================ */

function getTimeString(){

  const now =
    new Date();


  const hour =
    String(
      now.getHours()
    ).padStart(2,"0");


  const minute =
    String(
      now.getMinutes()
    ).padStart(2,"0");


  const second =
    String(
      now.getSeconds()
    ).padStart(2,"0");


  return (
    hour +
    minute +
    second
  );

}


/* ============================================================
   GET UNIQUE FILE NAME
     
   ตัวอย่าง:
     
   Count stock_20260829_100530.json
     
   ถ้าซ้ำ:
     
   Count stock_20260829_100530 (1).json
   Count stock_20260829_100530 (2).json
============================================================ */

async function getUniqueBackupFileName(){

  const date =
    getDateString();

  const time =
    getTimeString();


  const baseName =
    BACKUP_PREFIX +
    "_" +
    date +
    "_" +
    time;


  let fileName =
    baseName +
    ".json";


  let counter =
    1;


  /*
    ตรวจสอบชื่อไฟล์
  */

  while(true){

    try{

      await backupFolderHandle.getFileHandle(
        fileName,
        {
          create:false
        }
      );


      /*
        ถ้ามีไฟล์แล้ว
        ให้สร้างชื่อใหม่
      */

      fileName =
        baseName +
        " (" +
        counter +
        ").json";


      counter++;


    }catch(error){

      /*
        หาไฟล์ไม่เจอ
        ใช้ชื่อปัจจุบันได้
      */

      return fileName;

    }

  }

}


/* ============================================================
   CREATE BACKUP FILE
     
   Backup ทุกครั้งหลัง Scan
============================================================ */

async function createBackupFile(){

  if(
    !backupFolderHandle
  ){

    setBackupStatus(
      "⚠ Scan แล้ว แต่ยังไม่ได้ตั้งค่าโฟลเดอร์ Backup",
      "error"
    );

    return;

  }


  try{

    /*
      ตรวจสอบ permission
    */

    const permission =
      await verifyPermission(
        backupFolderHandle,
        true
      );


    if(!permission){

      setBackupStatus(
        "❌ ไม่มีสิทธิ์เขียนไฟล์ Backup",
        "error"
      );

      return;

    }


    /*
      สร้างชื่อไฟล์
    */

    const fileName =
      await getUniqueBackupFileName();


    /*
      ข้อมูลที่จะ Backup
    */

    const backupObject = {

      backupDate:
        new Date().toISOString(),

      totalRecords:
        data.length,

      data:
        data

    };


    /*
      JSON
    */

    const json =
      JSON.stringify(
        backupObject,
        null,
        2
      );


    /*
      สร้างไฟล์
    */

    const fileHandle =
      await backupFolderHandle.getFileHandle(
        fileName,
        {
          create:true
        }
      );


    const writable =
      await fileHandle.createWritable();


    await writable.write(
      json
    );


    await writable.close();


    setBackupStatus(
      "✅ Backup สำเร็จ: " +
      fileName,
      "ok"
    );


  }catch(error){

    console.error(
      "Create backup error:",
      error
    );


    setBackupStatus(
      "❌ Backup ไม่สำเร็จ: " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   SCAN EVENT
============================================================ */

qr.addEventListener(
  "keypress",
  async e => {

    if(e.key === "Enter"){

      await scan(
        qr.value
      );

      qr.value = "";

    }

  }
);


/* ============================================================
   SCAN
============================================================ */

async function scan(v){

  document
    .getElementById("duplicateAlert")
    .style.display =
    "none";


  /* ------------------------------------------------------------
     EMPTY
  ------------------------------------------------------------ */

  if(
    !v ||
    !v.trim()
  ){

    qr.focus();

    return;

  }


  v =
    v.trim();


  /* ------------------------------------------------------------
     DUPLICATE QR
  ------------------------------------------------------------ */

  if(
    scanned.includes(v)
  ){

    document
      .getElementById("duplicateAlert")
      .style.display =
      "block";


    qr.focus();

    return;

  }


  /* ------------------------------------------------------------
     SAVE SCANNED QR
  ------------------------------------------------------------ */

  scanned.push(v);


  /* ------------------------------------------------------------
     SPLIT QR
  ------------------------------------------------------------ */

  const d =
    v.split("|");


  const row =
    rowSelect.value;


  latestRowFocus =
    row;


  /* ------------------------------------------------------------
     LINE
  ------------------------------------------------------------ */

  const line =
    d[1] || "-";


  /* ------------------------------------------------------------
     LOCATION
  ------------------------------------------------------------ */

  const location =
    d[2] || "-";


  /* ------------------------------------------------------------
     PART
  ------------------------------------------------------------ */

  const part =
    d[4] || "-";


  /* ------------------------------------------------------------
     Q'TY
     
     ตัวอย่าง:
     
     200073618|T|QC FACT 1|1|VG79Y417H01|53|...
                                                   ↑
                                                  Q'ty
  ------------------------------------------------------------ */

  const qty =
    parseInt(
      d[5]
    ) || 0;


  /* ------------------------------------------------------------
     PO
  ------------------------------------------------------------ */

  const po =
    d[7] || "-";


  /* ------------------------------------------------------------
     LOT
     
     ตัวอย่าง:
     
     ...|9100003596|1930|
                          ↑
                         LOT
  ------------------------------------------------------------ */

  const lot =
    d[8] || "-";


  /* ------------------------------------------------------------
     TIME
  ------------------------------------------------------------ */

  const time =
    new Date().toLocaleString();


  /* ============================================================
     REMARK
  ============================================================ */

  let duplicateRows = [];


  data.forEach(item => {

    if(
      item.part === part &&
      item.row !== row &&
      !duplicateRows.includes(
        item.row
      )
    ){

      duplicateRows.push(
        item.row
      );

    }

  });


  let remark = "";


  if(
    duplicateRows.length > 0
  ){

    remark =
      "ข้อมูล Part item ซ้ำกับแถว " +
      duplicateRows.join(", ");

  }


  /* ============================================================
     SAVE DATA
  ============================================================ */

  data.push({

    row: row,

    line: line,

    location: location,

    part: part,

    qty: qty,

    po: po,

    lot: lot,

    remark: remark,

    time: time,

    key: v

  });


  /* ------------------------------------------------------------
     RENDER
  ------------------------------------------------------------ */

  render();


  /* ============================================================
     AUTO BACKUP
     
     สำคัญ:
     Backup หลัง Scan สำเร็จทันที
  ============================================================ */

  await createBackupFile();


  /* ------------------------------------------------------------
     FOCUS
  ------------------------------------------------------------ */

  qr.focus();

}


/* ============================================================
   RENDER
============================================================ */

function render(){

  tb.innerHTML = "";


  data.forEach(
    (x,i) => {

      tb.innerHTML += `

        <tr class="${
          i === data.length - 1
          ? "latest"
          : ""
        }">

          <td>
            ${escapeHtml(x.row)}
          </td>

          <td>
            ${i + 1}
          </td>

          <td>
            ${escapeHtml(x.line)}
          </td>

          <td>
            ${escapeHtml(x.location)}
          </td>

          <td>
            ${escapeHtml(x.part)}
          </td>

          <td>
            ${escapeHtml(x.qty)}
          </td>

          <td>
            ${escapeHtml(x.po)}
          </td>

          <td>
            ${escapeHtml(x.lot)}
          </td>

          <td>
            ${escapeHtml(x.remark)}
          </td>

          <td>
            ${escapeHtml(x.time)}
          </td>

          <td>

            <button
              class="del-btn"
              onclick="del(${i})"
            >
              Delete
            </button>

          </td>

        </tr>

      `;

    }
  );


  /* ============================================================
     AUTO SCROLL
  ============================================================ */

  const tableBox =
    document.querySelector(
      ".table-container"
    );


  if(tableBox){

    tableBox.scrollTop =
      tableBox.scrollHeight;

  }


  /* ============================================================
     SUMMARY
  ============================================================ */

  renderSummary();

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   DELETE
============================================================ */

async function del(i){

  if(
    i < 0 ||
    i >= data.length
  ){

    return;

  }


  scanned =
    scanned.filter(
      x =>
        x !== data[i].key
    );


  data.splice(
    i,
    1
  );


  render();


  /*
    Backup หลัง Delete
  */

  if(
    backupFolderHandle
  ){

    await createBackupFile();

  }

}


/* ============================================================
   SUMMARY
     
   Row + Part
     
   Unit = จำนวนครั้ง Scan
     
   Q'ty = ผลรวม Q'ty
     
   เช่น:
     
   Q'ty 53
   Unit 3
     
   = 159
============================================================ */

function renderSummary(){

  let summaryData = {};


  data.forEach(x => {

    const row =
      String(x.row);


    const part =
      String(
        x.part || "-"
      ).trim();


    if(
      !summaryData[row]
    ){

      summaryData[row] = {};

    }


    if(
      !summaryData[row][part]
    ){

      summaryData[row][part] = {

        unit:0,

        qty:0

      };

    }


    /*
      Unit
    */

    summaryData[row][part]
      .unit++;


    /*
      Q'ty
    */

    const qty =
      Number(x.qty);


    if(
      Number.isFinite(qty)
    ){

      summaryData[row][part]
        .qty += qty;

    }

  });


  /* ------------------------------------------------------------
     EMPTY
  ------------------------------------------------------------ */

  if(
    Object.keys(
      summaryData
    ).length === 0
  ){

    document
      .getElementById(
        "summary"
      )
      .innerHTML = "";

    return;

  }


  /* ------------------------------------------------------------
     HTML
  ------------------------------------------------------------ */

  let html = "";


  Object.keys(
    summaryData
  )
  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )
  .forEach(r => {

    let totalUnit = 0;

    let totalQty = 0;


    html += `

      <div class="
        summary-box
        ${
          latestRowFocus == r
          ? "summary-focus"
          : ""
        }
      ">

        <div class="summary-title">
          📍 Row ${escapeHtml(r)}
        </div>


        <table
          style="
            width:100%;
            border-collapse:collapse;
          "
        >

          <thead>

            <tr>

              <th>
                Part
              </th>

              <th>
                Unit
              </th>

              <th>
                Q'ty
              </th>

            </tr>

          </thead>


          <tbody>

    `;


    Object.keys(
      summaryData[r]
    )
    .forEach(p => {

      const unit =
        summaryData[r][p]
          .unit;


      const qty =
        summaryData[r][p]
          .qty;


      totalUnit +=
        unit;


      totalQty +=
        qty;


      html += `

        <tr>

          <td>
            ${escapeHtml(p)}
          </td>

          <td
            style="
              text-align:center;
            "
          >
            ${unit}
          </td>

          <td
            style="
              text-align:center;
            "
          >
            ${qty}
          </td>

        </tr>

      `;

    });


    html += `

          </tbody>


          <tfoot>

            <tr>

              <td>
                <b>TOTAL</b>
              </td>

              <td
                style="
                  text-align:center;
                "
              >
                <b>
                  ${totalUnit}
                </b>
              </td>

              <td
                style="
                  text-align:center;
                "
              >
                <b>
                  ${totalQty}
                </b>
              </td>

            </tr>

          </tfoot>

        </table>

      </div>

    `;

  });


  document
    .getElementById(
      "summary"
    )
    .innerHTML =
    html;

}


/* ============================================================
   CLEAR
============================================================ */

async function clearAll(){

  const confirmClear =
    confirm(
      "ต้องการล้างข้อมูลทั้งหมดหรือไม่?"
    );


  if(!confirmClear){

    return;

  }


  data = [];

  scanned = [];

  latestRowFocus = "";


  tb.innerHTML =
    "";


  document
    .getElementById(
      "summary"
    )
    .innerHTML =
    "";


  document
    .getElementById(
      "duplicateAlert"
    )
    .style.display =
    "none";


  /*
    ไม่ลบไฟล์ Backup เดิม

    เพื่อป้องกันข้อมูลสูญหาย
  */

  setBackupStatus(
    "⚠ ข้อมูลบนหน้าจอถูก Clear แล้ว แต่ไฟล์ Backup เดิมยังอยู่",
    "ok"
  );


  qr.focus();

}


/* ============================================================
   EXPORT EXCEL
============================================================ */

function exportExcel(){

  let wb =
    XLSX.utils.book_new();


  /* ============================================================
     RAW DATA
  ============================================================ */

  let rawData =
    data.map(x => ({

      Row:
        x.row,

      Line:
        x.line,

      Location:
        x.location,

      Part:
        x.part,

      "Q'ty":
        Number(x.qty) || 0,

      PO:
        x.po,

      LOT:
        x.lot,

      Remark:
        x.remark,

      Time:
        x.time

    }));


  let ws1 =
    XLSX.utils.json_to_sheet(
      rawData
    );


  XLSX.utils.book_append_sheet(
    wb,
    ws1,
    "RawData"
  );


  /* ============================================================
     SUMMARY DATA
  ============================================================ */

  let summaryData = {};


  data.forEach(x => {

    const row =
      String(x.row);


    const part =
      String(
        x.part || "-"
      ).trim();


    if(
      !summaryData[row]
    ){

      summaryData[row] = {};

    }


    if(
      !summaryData[row][part]
    ){

      summaryData[row][part] = {

        unit:0,

        qty:0

      };

    }


    summaryData[row][part]
      .unit++;


    const qty =
      Number(x.qty);


    if(
      Number.isFinite(qty)
    ){

      summaryData[row][part]
        .qty += qty;

    }

  });


  /* ============================================================
     BUILD SUMMARY
  ============================================================ */

  let summarySheet = [];


  Object.keys(
    summaryData
  )
  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )
  .forEach(r => {

    let totalUnit = 0;

    let totalQty = 0;


    Object.keys(
      summaryData[r]
    )
    .forEach(p => {

      const unit =
        summaryData[r][p]
          .unit;


      const qty =
        summaryData[r][p]
          .qty;


      totalUnit +=
        unit;


      totalQty +=
        qty;


      summarySheet.push({

        Row:
          r,

        Part:
          p,

        Unit:
          unit,

        "Q'ty":
          qty

      });

    });


    /* ----------------------------------------------------------
       TOTAL
    ---------------------------------------------------------- */

    summarySheet.push({

      Row:
        r,

      Part:
        "TOTAL",

      Unit:
        totalUnit,

      "Q'ty":
        totalQty

    });

  });


  /* ============================================================
     SUMMARY WORKSHEET
  ============================================================ */

  let ws2 =
    XLSX.utils.json_to_sheet(
      summarySheet
    );


  /* ============================================================
     STYLE
  ============================================================ */

  if(ws2["!ref"]){

    let range =
      XLSX.utils.decode_range(
        ws2["!ref"]
      );


    for(
      let R = range.s.r;
      R <= range.e.r;
      R++
    ){

      for(
        let C = range.s.c;
        C <= range.e.c;
        C++
      ){

        let addr =
          XLSX.utils.encode_cell({
            r:R,
            c:C
          });


        let cell =
          ws2[addr];


        if(!cell){

          continue;

        }


        /* HEADER */

        if(R === 0){

          cell.s = {

            font:{

              bold:true,

              color:{
                rgb:"FFFFFF"
              }

            },

            fill:{

              fgColor:{
                rgb:"4472C4"
              }

            }

          };

        }


        /* TOTAL */

        if(
          cell.v === "TOTAL"
        ){

          for(
            let i = 0;
            i <= 3;
            i++
          ){

            let totalAddr =
              XLSX.utils.encode_cell({

                r:R,

                c:i

              });


            if(
              ws2[totalAddr]
            ){

              ws2[
                totalAddr
              ].s = {

                font:{
                  bold:true
                },

                fill:{

                  fgColor:{
                    rgb:"B7DEE8"
                  }

                }

              };

            }

          }

        }

      }

    }

  }


  /* ============================================================
     AUTO WIDTH
  ============================================================ */

  let cols = [];


  summarySheet.forEach(
    row => {

      Object.keys(row)
        .forEach(
          (k,i) => {

            let len =
              String(
                row[k]
              ).length;


            if(!cols[i]){

              cols[i] = {
                wch:10
              };

            }


            if(
              len >
              cols[i].wch
            ){

              cols[i].wch =
                len + 4;

            }

          }
        );

    }
  );


  ws2["!cols"] =
    cols;


  /* ============================================================
     APPEND SUMMARY
  ============================================================ */

  XLSX.utils.book_append_sheet(
    wb,
    ws2,
    "Summary"
  );


  /* ============================================================
     DOWNLOAD
  ============================================================ */

  XLSX.writeFile(
    wb,
    "inventory_report.xlsx"
  );

}


/* ============================================================
   INITIAL
============================================================ */

if(
  !isFileSystemAccessSupported()
){

  setBackupStatus(
    "⚠ Browser นี้ไม่รองรับ Auto Backup ลงโฟลเดอร์ กรุณาใช้ Chrome หรือ Edge",
    "error"
  );

}

</script>
