<script>


/* ============================================================
   GLOBAL DATA
============================================================ */

let data = [];

let scanned = [];

let latestRowFocus = "";


/* ============================================================
   BACKUP SETTINGS
============================================================ */

const BACKUP_FOLDER_NAME =
  "Count stock";


const BACKUP_FILE_PREFIX =
  "Stock Counting";


let backupRootHandle = null;

let backupFolderHandle = null;


/* ============================================================
   DOM
============================================================ */

const tb =
  document.getElementById("tb");


const qr =
  document.getElementById("qrInput");


const rowSelect =
  document.getElementById("rowSelect");


const backupStatus =
  document.getElementById("backupStatus");


/* ============================================================
   CREATE ROW 1 - 50
============================================================ */

for(
  let i = 1;
  i <= 50;
  i++
){

  rowSelect.innerHTML += `

    <option value="${i}">
      Row ${i}
    </option>

  `;

}


/* ============================================================
   CHECK BROWSER SUPPORT
============================================================ */

function isBackupSupported(){

  return (
    "showDirectoryPicker" in window
  );

}


/* ============================================================
   BACKUP STATUS
============================================================ */

function setBackupStatus(
  message,
  type = ""
){

  backupStatus.textContent =
    message;

  backupStatus.className =
    type;

}


/* ============================================================
   SELECT BACKUP DRIVE
============================================================ */

async function selectBackupDrive(){

  if(
    !isBackupSupported()
  ){

    alert(

      "Browser นี้ไม่รองรับการ Backup ลง C:\\\n\n" +

      "กรุณาใช้ Google Chrome หรือ Microsoft Edge รุ่นใหม่"

    );

    return;

  }


  try{

    /* --------------------------------------------------------
       เลือก Drive C
    -------------------------------------------------------- */

    backupRootHandle =
      await window.showDirectoryPicker({

        mode:"readwrite"

      });


    /* --------------------------------------------------------
       ตรวจสอบ Permission
    -------------------------------------------------------- */

    const permission =
      await verifyPermission(

        backupRootHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่ได้รับสิทธิ์เขียนไฟล์",

        "error"

      );

      return;

    }


    /* --------------------------------------------------------
       เปิด / สร้าง Count stock
       
       ถ้ามีแล้วจะไม่สร้างใหม่
    -------------------------------------------------------- */

    backupFolderHandle =
      await backupRootHandle
        .getDirectoryHandle(

          BACKUP_FOLDER_NAME,

          {
            create:true
          }

        );


    setBackupStatus(

      "✅ Backup พร้อมใช้งาน → C:\\Count stock",

      "ok"

    );


    alert(

      "ตั้งค่า Backup สำเร็จ\n\n" +

      "Folder:\n" +

      "C:\\Count stock\n\n" +

      "ระบบจะบันทึกข้อมูลลงไฟล์ของวันนั้นต่อเนื่อง"

    );


    qr.focus();

  }

  catch(error){

    console.error(
      error
    );


    backupRootHandle = null;

    backupFolderHandle = null;


    setBackupStatus(

      "❌ ไม่สามารถตั้งค่า Backup Folder ได้: " +

      error.message,

      "error"

    );

  }

}


/* ============================================================
   VERIFY PERMISSION
============================================================ */

async function verifyPermission(
  handle,
  withWrite
){

  try{

    const options = {};


    if(withWrite){

      options.mode =
        "readwrite";

    }


    if(

      await handle
        .queryPermission(
          options
        ) === "granted"

    ){

      return true;

    }


    if(

      await handle
        .requestPermission(
          options
        ) === "granted"

    ){

      return true;

    }


    return false;

  }

  catch(error){

    console.error(
      error
    );

    return false;

  }

}


/* ============================================================
   DATE YYYYMMDD
============================================================ */

function getDateString(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day

  );

}


/* ============================================================
   DISPLAY DATE TIME
============================================================ */

function getDisplayDateTime(){

  return new Date()
    .toLocaleString();

}


/* ============================================================
   DAILY BACKUP FILE NAME
============================================================ */

function getDailyFileName(){

  return (

    BACKUP_FILE_PREFIX +

    "_" +

    getDateString() +

    ".csv"

  );

}


/* ============================================================
   CSV ESCAPE
============================================================ */

function csvEscape(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  let text =
    String(value);


  text =
    text.replace(
      /"/g,
      '""'
    );


  if(

    text.includes(",") ||

    text.includes('"') ||

    text.includes("\n") ||

    text.includes("\r")

  ){

    return '"' +
      text +
      '"';

  }


  return text;

}


/* ============================================================
   CSV HEADER
============================================================ */

function createCSVHeader(){

  return [

    "Row",

    "No",

    "Line",

    "Location",

    "Part",

    "Q'ty",

    "PO",

    "LOT",

    "Remark",

    "Time"

  ]

  .map(
    csvEscape
  )

  .join(",");

}


/* ============================================================
   CSV ROW
============================================================ */

function createCSVRow(
  x
){

  return [

    x.row,

    x.no,

    x.line,

    x.location,

    x.part,

    Number(x.qty) || 0,

    x.po,

    x.lot,

    x.remark,

    x.time

  ]

  .map(
    csvEscape
  )

  .join(",");

}


/* ============================================================
   AUTO BACKUP CSV
     
   IMPORTANT:
   ทุก Scan จะเปิด FileHandle ใหม่
   ไม่ใช้ FileHandle เก่าค้างไว้
     
   ช่วยป้องกัน:
   "An operation that depends on state cached
    in an interface object..."
============================================================ */

async function backupScan(
  scanData
){

  if(
    !backupFolderHandle
  ){

    setBackupStatus(

      "⚠ Scan สำเร็จ แต่ยังไม่ได้ตั้งค่า C:\\Count stock",

      "error"

    );

    return false;

  }


  try{

    /* --------------------------------------------------------
       ตรวจสอบ Permission
    -------------------------------------------------------- */

    const permission =
      await verifyPermission(

        backupFolderHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่มีสิทธิ์เขียนไฟล์ Backup",

        "error"

      );

      return false;

    }


    /* --------------------------------------------------------
       สร้างชื่อไฟล์วันนี้
       
       ตัวอย่าง:
       Stock Counting_20260829.csv
    -------------------------------------------------------- */

    const fileName =
      getDailyFileName();


    let fileHandle = null;

    let fileExists = true;


    /* --------------------------------------------------------
       เปิดไฟล์เดิม
    -------------------------------------------------------- */

    try{

      fileHandle =
        await backupFolderHandle
          .getFileHandle(

            fileName,

            {
              create:false
            }

          );

    }

    catch(error){

      fileExists = false;

    }


    /* ========================================================
       FILE EXISTS
       
       เพิ่มข้อมูลต่อจากไฟล์เดิม
    ======================================================== */

    if(
      fileExists &&
      fileHandle
    ){

      /* ------------------------------------------------------
         อ่านไฟล์ปัจจุบัน
      ------------------------------------------------------ */

      const file =
        await fileHandle.getFile();


      let oldText =
        await file.text();


      /* ------------------------------------------------------
         ลบ BOM
      ------------------------------------------------------ */

      oldText =
        oldText.replace(
          /^\uFEFF/,
          ""
        );


      /* ------------------------------------------------------
         สร้าง Row ใหม่
      ------------------------------------------------------ */

      const newRow =
        createCSVRow(
          scanData
        );


      /* ------------------------------------------------------
         ตรวจสอบท้ายไฟล์
      ------------------------------------------------------ */

      if(

        oldText.length > 0 &&

        !oldText.endsWith("\n") &&

        !oldText.endsWith("\r")

      ){

        oldText +=
          "\r\n";

      }


      /* ------------------------------------------------------
         เพิ่มข้อมูล
      ------------------------------------------------------ */

      const finalText =

        "\uFEFF" +

        oldText +

        newRow +

        "\r\n";


      /* ------------------------------------------------------
         Writable ใหม่
      ------------------------------------------------------ */

      const writable =
        await fileHandle
          .createWritable();


      await writable.write(
        finalText
      );


      await writable.close();


      setBackupStatus(

        "✅ Backup ต่อไฟล์เดิมสำเร็จ → C:\\Count stock\\" +

        fileName,

        "ok"

      );


      return true;

    }


    /* ========================================================
       FILE ยังไม่มี
       
       สร้างครั้งแรกของวัน
    ======================================================== */

    else{

      fileHandle =
        await backupFolderHandle
          .getFileHandle(

            fileName,

            {
              create:true
            }

          );


      const csvText =

        "\uFEFF" +

        createCSVHeader() +

        "\r\n" +

        createCSVRow(
          scanData
        ) +

        "\r\n";


      const writable =
        await fileHandle
          .createWritable();


      await writable.write(
        csvText
      );


      await writable.close();


      setBackupStatus(

        "✅ สร้าง Backup ไฟล์วันนี้สำเร็จ → C:\\Count stock\\" +

        fileName,

        "ok"

      );


      return true;

    }

  }

  catch(error){

    console.error(
      "Backup Error:",
      error
    );


    /* ========================================================
       State Cache Error
    ======================================================== */

    if(

      error.message.includes(
        "state cached"
      )

    ){

      backupRootHandle = null;

      backupFolderHandle = null;


      setBackupStatus(

        "❌ Backup State เปลี่ยนแปลง กรุณากด 'ตั้งค่า Backup C:\\Count stock' ใหม่",

        "error"

      );


      return false;

    }


    setBackupStatus(

      "❌ Backup ไม่สำเร็จ: " +

      error.message,

      "error"

    );


    return false;

  }

}


/* ============================================================
   BACKUP INFO
============================================================ */

function showBackupInfo(){

  if(
    !backupFolderHandle
  ){

    alert(

      "ยังไม่ได้ตั้งค่า Backup\n\n" +

      "กรุณากด:\n" +

      "📁 ตั้งค่า Backup C:\\Count stock"

    );

    return;

  }


  alert(

    "📁 Backup Folder\n\n" +

    "C:\\Count stock\n\n" +

    "📄 ไฟล์วันนี้\n\n" +

    getDailyFileName() +

    "\n\n" +

    "ทุก Scan จะถูกเพิ่มต่อท้ายไฟล์เดิม\n\n" +

    "ไม่มีการสร้างไฟล์ใหม่ทุกครั้งที่ Scan"

  );

}


/* ============================================================
   SCAN EVENT
============================================================ */

qr.addEventListener(

  "keypress",

  async function(e){

    if(
      e.key === "Enter"
    ){

      const value =
        qr.value;


      qr.value = "";


      await scan(
        value
      );

    }

  }

);


/* ============================================================
   SCAN FUNCTION
============================================================ */

async function scan(v){

  document
    .getElementById(
      "duplicateAlert"
    )
    .style.display =
    "none";


  /* ----------------------------------------------------------
     Empty
  ---------------------------------------------------------- */

  if(
    !v ||
    !v.trim()
  ){

    qr.focus();

    return;

  }


  v =
    v.trim();


  /* ----------------------------------------------------------
     Duplicate QR
  ---------------------------------------------------------- */

  if(
    scanned.includes(v)
  ){

    document
      .getElementById(
        "duplicateAlert"
      )
      .style.display =
      "block";


    qr.focus();

    return;

  }


  /* ==========================================================
     SPLIT QR
     
     Example:
     
     200073618|T|QC FACT 1|1|VG79Y417H01|53|
     2608c640e61d762c4fe1|9100003596|1930|
     
     d[1] = Line
     d[2] = Location
     d[4] = Part
     d[5] = Q'ty
     d[7] = PO
     d[8] = LOT
  ========================================================== */

  const d =
    v.split("|");


  const row =
    rowSelect.value;


  latestRowFocus =
    row;


  const line =
    d[1] || "-";


  const location =
    d[2] || "-";


  const part =
    d[4] || "-";


  const qty =
    parseInt(
      d[5],
      10
    ) || 0;


  const po =
    d[7] || "-";


  const lot =
    d[8] || "-";


  const time =
    getDisplayDateTime();


  /* ==========================================================
     DUPLICATE PART REMARK
  ========================================================== */

  let duplicateRows = [];


  data.forEach(
    item => {

      if(

        item.part === part &&

        item.row !== row &&

        !duplicateRows.includes(
          item.row
        )

      ){

        duplicateRows.push(
          item.row
        );

      }

    }
  );


  let remark = "";


  if(
    duplicateRows.length > 0
  ){

    remark =

      "ข้อมูล Part item ซ้ำกับแถว " +

      duplicateRows.join(", ");

  }


  /* ==========================================================
     CREATE SCAN DATA
  ========================================================== */

  const scanData = {

    row:
      row,

    no:
      data.length + 1,

    line:
      line,

    location:
      location,

    part:
      part,

    qty:
      qty,

    po:
      po,

    lot:
      lot,

    remark:
      remark,

    time:
      time,

    key:
      v

  };


  /* ==========================================================
     SAVE TO MEMORY
  ========================================================== */

  scanned.push(v);

  data.push(
    scanData
  );


  /* ==========================================================
     RENDER
  ========================================================== */

  render();


  /* ==========================================================
     AUTO BACKUP
  ========================================================== */

  await backupScan(
    scanData
  );


  /* ==========================================================
     FOCUS
  ========================================================== */

  qr.focus();

}


/* ============================================================
   RENDER TABLE
============================================================ */

function render(){

  tb.innerHTML = "";


  data.forEach(
    (x,i) => {

      tb.innerHTML += `

        <tr
          class="${
            i === data.length - 1
            ? "latest"
            : ""
          }"
        >

          <td>
            ${escapeHtml(x.row)}
          </td>


          <td>
            ${i + 1}
          </td>


          <td>
            ${escapeHtml(x.line)}
          </td>


          <td>
            ${escapeHtml(x.location)}
          </td>


          <td>
            ${escapeHtml(x.part)}
          </td>


          <td>
            ${escapeHtml(x.qty)}
          </td>


          <td>
            ${escapeHtml(x.po)}
          </td>


          <td>
            ${escapeHtml(x.lot)}
          </td>


          <td>
            ${escapeHtml(x.remark)}
          </td>


          <td>
            ${escapeHtml(x.time)}
          </td>


          <td>

            <button
              class="del-btn"
              onclick="del(${i})"
            >
              Delete
            </button>

          </td>

        </tr>

      `;

    }
  );


  /* ==========================================================
     AUTO SCROLL
  ========================================================== */

  const tableBox =
    document.querySelector(
      ".table-container"
    );


  if(tableBox){

    tableBox.scrollTop =
      tableBox.scrollHeight;

  }


  /* ==========================================================
     SUMMARY
  ========================================================== */

  renderSummary();

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   DELETE
============================================================ */

function del(i){

  if(
    i < 0 ||
    i >= data.length
  ){

    return;

  }


  const confirmed =
    confirm(

      "⚠️ ต้องการลบรายการนี้หรือไม่?\n\n" +

      "ข้อมูลจะถูกลบออกจากหน้าเว็บ\n\n" +

      "Backup CSV จะยังคงอยู่"

    );


  if(!confirmed){

    return;

  }


  scanned =
    scanned.filter(

      x =>
        x !== data[i].key

    );


  data.splice(
    i,
    1
  );


  render();


  qr.focus();

}


/* ============================================================
   SUMMARY
     
   Unit = จำนวนครั้งที่ Scan
     
   Q'ty / Unit = Q'ty จาก QR
     
   Total Q'ty = Unit × Q'ty
============================================================ */

function renderSummary(){

  let summaryData = {};


  data.forEach(
    x => {

      const row =
        String(
          x.row
        );


      const part =
        String(
          x.part || "-"
        ).trim();


      if(
        !summaryData[row]
      ){

        summaryData[row] = {};

      }


      if(
        !summaryData[row][part]
      ){

        summaryData[row][part] = {

          unit:
            0,

          qtyPerUnit:
            0,

          totalQty:
            0

        };

      }


      /* ------------------------------------------------------
         UNIT
      ------------------------------------------------------ */

      summaryData[row][part]
        .unit++;


      /* ------------------------------------------------------
         QTY / UNIT
      ------------------------------------------------------ */

      const currentQty =
        Number(
          x.qty
        ) || 0;


      if(

        summaryData[row][part]
          .unit === 1

      ){

        summaryData[row][part]
          .qtyPerUnit =
          currentQty;

      }


      /* ------------------------------------------------------
         TOTAL QTY
         
         Unit × Q'ty
      ------------------------------------------------------ */

      summaryData[row][part]
        .totalQty +=
        currentQty;

    }
  );


  /* ==========================================================
     EMPTY
  ========================================================== */

  if(
    Object.keys(
      summaryData
    ).length === 0
  ){

    document
      .getElementById(
        "summary"
      )
      .innerHTML =
      "";

    return;

  }


  /* ==========================================================
     BUILD HTML
  ========================================================== */

  let html = "";


  Object.keys(
    summaryData
  )

  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )

  .forEach(
    r => {

      let totalUnit = 0;

      let totalQty = 0;


      html += `

        <div
          class="
            summary-box
            ${
              latestRowFocus == r
              ? "summary-focus"
              : ""
            }
          "
        >

          <div
            class="summary-title"
          >

            📍 Row ${escapeHtml(r)}

          </div>


          <table
            style="
              width:100%;
              border-collapse:collapse;
            "
          >

            <thead>

              <tr>

                <th>
                  Part
                </th>

                <th>
                  Unit
                </th>

                <th>
                  Q'ty / Unit
                </th>

                <th>
                  Total Q'ty
                </th>

              </tr>

            </thead>


            <tbody>

      `;


      Object.keys(
        summaryData[r]
      )

      .forEach(
        p => {

          const unit =
            summaryData[r][p]
              .unit;


          const qtyPerUnit =
            summaryData[r][p]
              .qtyPerUnit;


          const total =
            summaryData[r][p]
              .totalQty;


          totalUnit +=
            unit;


          totalQty +=
            total;


          html += `

            <tr>

              <td>
                ${escapeHtml(p)}
              </td>


              <td
                style="
                  text-align:center;
                "
              >

                ${unit}

              </td>


              <td
                style="
                  text-align:center;
                "
              >

                ${qtyPerUnit}

              </td>


              <td
                style="
                  text-align:center;
                  font-weight:bold;
                "
              >

                ${total}

              </td>

            </tr>

          `;

        }
      );


      /* ======================================================
         TOTAL
      ====================================================== */

      html += `

            </tbody>


            <tfoot>

              <tr>

                <td>
                  <b>TOTAL</b>
                </td>


                <td
                  style="
                    text-align:center;
                  "
                >

                  <b>
                    ${totalUnit}
                  </b>

                </td>


                <td
                  style="
                    text-align:center;
                  "
                >

                  -

                </td>


                <td
                  style="
                    text-align:center;
                  "
                >

                  <b>
                    ${totalQty}
                  </b>

                </td>

              </tr>

            </tfoot>


          </table>


        </div>

      `;

    }
  );


  document
    .getElementById(
      "summary"
    )
    .innerHTML =
    html;

}

}


/* ============================================================
   EXPORT EXCEL
============================================================ */

function exportExcel(){

  /* ==========================================================
     CHECK DATA
  ========================================================== */

  if(
    data.length === 0
  ){

    alert(
      "ยังไม่มีข้อมูลสำหรับ Export Excel"
    );

    qr.focus();

    return;

  }


  /* ==========================================================
     CREATE WORKBOOK
  ========================================================== */

  const wb =
    XLSX.utils.book_new();


  /* ==========================================================
     RAW DATA
  ========================================================== */

  const rawData =
    data.map(
      (x,i) => ({

        Row:
          x.row,

        No:
          i + 1,

        Line:
          x.line,

        Location:
          x.location,

        Part:
          x.part,

        "Q'ty":
          Number(x.qty) || 0,

        PO:
          x.po,

        LOT:
          x.lot,

        Remark:
          x.remark,

        Time:
          x.time

      })
    );


  /* ==========================================================
     RAW SHEET
  ========================================================== */

  const ws1 =
    XLSX.utils.json_to_sheet(
      rawData
    );


  /* ==========================================================
     RAW HEADER STYLE
  ========================================================== */

  if(ws1["!ref"]){

    const range =
      XLSX.utils.decode_range(
        ws1["!ref"]
      );


    for(
      let C = range.s.c;
      C <= range.e.c;
      C++
    ){

      const addr =
        XLSX.utils.encode_cell({

          r:0,

          c:C

        });


      if(
        ws1[addr]
      ){

        ws1[addr].s = {

          font:{

            bold:true,

            color:{
              rgb:"FFFFFF"
            }

          },

          fill:{

            fgColor:{
              rgb:"4472C4"
            }

          },

          alignment:{

            horizontal:
              "center",

            vertical:
              "center"

          }

        };

      }

    }

  }


  /* ==========================================================
     RAW COLUMN WIDTH
  ========================================================== */

  ws1["!cols"] = [

    {wch:8},

    {wch:8},

    {wch:12},

    {wch:20},

    {wch:25},

    {wch:12},

    {wch:18},

    {wch:15},

    {wch:35},

    {wch:22}

  ];


  /* ==========================================================
     APPEND RAW DATA
  ========================================================== */

  XLSX.utils.book_append_sheet(

    wb,

    ws1,

    "RawData"

  );


  /* ==========================================================
     SUMMARY DATA
  ========================================================== */

  let summaryData = {};


  data.forEach(
    x => {

      const row =
        String(
          x.row
        );


      const part =
        String(
          x.part || "-"
        ).trim();


      if(
        !summaryData[row]
      ){

        summaryData[row] = {};

      }


      if(
        !summaryData[row][part]
      ){

        summaryData[row][part] = {

          unit:
            0,

          qtyPerUnit:
            0,

          totalQty:
            0

        };

      }


      /* ------------------------------------------------------
         UNIT
      ------------------------------------------------------ */

      summaryData[row][part]
        .unit++;


      /* ------------------------------------------------------
         QTY
      ------------------------------------------------------ */

      const currentQty =
        Number(
          x.qty
        ) || 0;


      if(

        summaryData[row][part]
          .unit === 1

      ){

        summaryData[row][part]
          .qtyPerUnit =
          currentQty;

      }


      /* ------------------------------------------------------
         TOTAL
      ------------------------------------------------------ */

      summaryData[row][part]
        .totalQty +=
        currentQty;

    }
  );


  /* ==========================================================
     BUILD SUMMARY
  ========================================================== */

  let summarySheet = [];


  Object.keys(
    summaryData
  )

  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )

  .forEach(
    r => {

      let totalUnit = 0;

      let totalQty = 0;


      Object.keys(
        summaryData[r]
      )

      .forEach(
        p => {

          const unit =
            summaryData[r][p]
              .unit;


          const qtyPerUnit =
            summaryData[r][p]
              .qtyPerUnit;


          const totalQtyPart =
            summaryData[r][p]
              .totalQty;


          totalUnit +=
            unit;


          totalQty +=
            totalQtyPart;


          summarySheet.push({

            Row:
              r,

            Part:
              p,

            Unit:
              unit,

            "Q'ty / Unit":
              qtyPerUnit,

            "Total Q'ty":
              totalQtyPart

          });

        }
      );


      /* ======================================================
         TOTAL ROW
      ====================================================== */

      summarySheet.push({

        Row:
          r,

        Part:
          "TOTAL",

        Unit:
          totalUnit,

        "Q'ty / Unit":
          "",

        "Total Q'ty":
          totalQty

      });

    }
  );


  /* ==========================================================
     SUMMARY WORKSHEET
  ========================================================== */

  const ws2 =
    XLSX.utils.json_to_sheet(
      summarySheet
    );


  /* ==========================================================
     SUMMARY STYLE
  ========================================================== */

  if(ws2["!ref"]){

    const range =
      XLSX.utils.decode_range(
        ws2["!ref"]
      );


    for(
      let R = range.s.r;
      R <= range.e.r;
      R++
    ){

      for(
        let C = range.s.c;
        C <= range.e.c;
        C++
      ){

        const addr =
          XLSX.utils.encode_cell({

            r:R,

            c:C

          });


        const cell =
          ws2[addr];


        if(!cell){

          continue;

        }


        /* ----------------------------------------------------
           HEADER
        ---------------------------------------------------- */

        if(R === 0){

          cell.s = {

            font:{

              bold:true,

              color:{
                rgb:"FFFFFF"
              }

            },

            fill:{

              fgColor:{
                rgb:"4472C4"
              }

            },

            alignment:{

              horizontal:
                "center",

              vertical:
                "center"

            }

          };

        }


        /* ----------------------------------------------------
           TOTAL ROW
        ---------------------------------------------------- */

        const partCell =
          ws2[
            XLSX.utils.encode_cell({

              r:R,

              c:1

            })
          ];


        if(

          partCell &&

          partCell.v === "TOTAL"

        ){

          for(
            let C2 = 0;
            C2 <= 4;
            C2++
          ){

            const totalAddr =
              XLSX.utils.encode_cell({

                r:R,

                c:C2

              });


            if(
              ws2[totalAddr]
            ){

              ws2[totalAddr].s = {

                font:{

                  bold:true

                },

                fill:{

                  fgColor:{
                    rgb:"B7DEE8"
                  }

                }

              };

            }

          }

        }

      }

    }

  }


  /* ==========================================================
     SUMMARY COLUMN WIDTH
  ========================================================== */

  ws2["!cols"] = [

    {wch:10},

    {wch:25},

    {wch:12},

    {wch:15},

    {wch:15}

  ];


  /* ==========================================================
     NUMBER FORMAT
  ========================================================== */

  if(ws2["!ref"]){

    const range =
      XLSX.utils.decode_range(
        ws2["!ref"]
      );


    for(
      let R = 1;
      R <= range.e.r;
      R++
    ){

      /* ------------------------------------------------------
         UNIT
      ------------------------------------------------------ */

      const unitCell =
        ws2[
          XLSX.utils.encode_cell({

            r:R,

            c:2

          })
        ];


      if(unitCell){

        unitCell.z =
          "#,##0";

      }


      /* ------------------------------------------------------
         QTY PER UNIT
      ------------------------------------------------------ */

      const qtyCell =
        ws2[
          XLSX.utils.encode_cell({

            r:R,

            c:3

          })
        ];


      if(

        qtyCell &&

        typeof qtyCell.v === "number"

      ){

        qtyCell.z =
          "#,##0";

      }


      /* ------------------------------------------------------
         TOTAL QTY
      ------------------------------------------------------ */

      const totalCell =
        ws2[
          XLSX.utils.encode_cell({

            r:R,

            c:4

          })
        ];


      if(

        totalCell &&

        typeof totalCell.v === "number"

      ){

        totalCell.z =
          "#,##0";

      }

    }

  }


  /* ==========================================================
     APPEND SUMMARY
  ========================================================== */

  XLSX.utils.book_append_sheet(

    wb,

    ws2,

    "Summary"

  );


  /* ==========================================================
     FILE NAME
  ========================================================== */

  const fileName =

    BACKUP_FILE_PREFIX +

    "_" +

    getDateString() +

    "_Export.xlsx";


  /* ==========================================================
     DOWNLOAD
  ========================================================== */

  XLSX.writeFile(

    wb,

    fileName

  );


  setBackupStatus(

    "✅ Export Excel สำเร็จ → " +
    fileName,

    "ok"

  );


  qr.focus();

}


/* ============================================================
   INITIAL STATUS
============================================================ */

if(
  !isBackupSupported()
){

  setBackupStatus(

    "⚠ Browser ไม่รองรับ Auto Backup ลง C:\\ กรุณาใช้ Google Chrome หรือ Microsoft Edge รุ่นใหม่",

    "error"

  );

}
else{

  setBackupStatus(

    "⚠ กรุณากด 'ตั้งค่า Backup C:\\Count stock' ก่อน Scan",

    ""

  );

}


/* ============================================================
   INITIAL FOCUS
============================================================ */

qr.focus();


</script>
