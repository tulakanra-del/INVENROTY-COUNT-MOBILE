<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>INVENTORY COUNTING SYSTEM</title>


<style>

/* ============================================================
   BODY
============================================================ */

body{

  font-family:Arial,sans-serif;

  background:#f4f6f9;

  margin:0;

  padding:20px;

  color:#111;

}


/* ============================================================
   CONTAINER
============================================================ */

.container{

  max-width:1300px;

  margin:auto;

  background:#fff;

  padding:24px;

  border-radius:14px;

  box-shadow:
    0 6px 18px
    rgba(0,0,0,0.08);

}


/* ============================================================
   TITLE
============================================================ */

h2{

  margin-top:0;

}


/* ============================================================
   INPUT
============================================================ */

.scan-row{

  display:flex;

  gap:15px;

  margin-bottom:15px;

}


input,
select{

  width:100%;

  padding:14px;

  font-size:16px;

  border-radius:10px;

  border:1px solid #cbd5e1;

  box-sizing:border-box;

}


/* ============================================================
   BUTTON
============================================================ */

button{

  padding:12px 16px;

  border:none;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

  margin-right:6px;

}


.btn-blue{

  background:#2563eb;

  color:#fff;

}


.btn-green{

  background:#16a34a;

  color:#fff;

}


.btn-orange{

  background:#f59e0b;

  color:#fff;

}


.btn-red{

  background:#dc2626;

  color:#fff;

}


.del-btn{

  background:#ef4444;

  color:#fff;

  padding:6px 10px;

  border-radius:6px;

  font-size:12px;

}


/* ============================================================
   BACKUP STATUS
============================================================ */

#backupStatus{

  margin-top:12px;

  padding:10px 12px;

  background:#f1f5f9;

  border-radius:8px;

  font-size:13px;

  color:#475569;

}


#backupStatus.ok{

  background:#dcfce7;

  color:#166534;

}


#backupStatus.error{

  background:#fee2e2;

  color:#991b1b;

}


/* ============================================================
   TABLE
============================================================ */

.table-container{

  margin-top:20px;

  max-height:420px;

  overflow:auto;

  border:1px solid #ddd;

  border-radius:10px;

}


table{

  width:100%;

  border-collapse:collapse;

}


th,
td{

  border:1px solid #e5e7eb;

  padding:8px;

  font-size:13px;

  white-space:nowrap;

}


th{

  background:#f1f5f9;

  position:sticky;

  top:0;

  z-index:10;

}


.latest{

  background:#fff7cc;

}


/* ============================================================
   SUMMARY
============================================================ */

#summaryWrapper{

  margin-top:20px;

  border:1px solid #ddd;

  border-radius:10px;

  max-height:350px;

  overflow-y:auto;

  padding:12px;

  background:#fafafa;

}


.summary-box{

  background:#fff;

  border:2px solid #e5e7eb;

  border-radius:12px;

  padding:14px;

  margin-bottom:12px;

  transition:0.2s;

}


.summary-focus{

  border:2px solid #2563eb;

  background:#eff6ff;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,0.15);

}


.summary-title{

  font-size:18px;

  font-weight:bold;

  margin-bottom:10px;

}


/* ============================================================
   ALERT
============================================================ */

#duplicateAlert{

  display:none;

  background:#fee2e2;

  color:#991b1b;

  padding:12px;

  border-radius:10px;

  margin-bottom:15px;

  font-weight:bold;

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:700px){

  .scan-row{

    flex-direction:column;

  }

  .container{

    padding:15px;

  }

}

</style>

</head>


<body>


<div class="container">


<h2>
  📦 INVENTORY COUNT SYSTEM
</h2>


<!-- ============================================================
     SCAN INPUT
============================================================ -->

<div class="scan-row">


<select id="rowSelect"></select>


<input
  id="qrInput"
  placeholder="Scan QR Code..."
  autofocus
>


</div>


<!-- ============================================================
     DUPLICATE ALERT
============================================================ -->

<div id="duplicateAlert">

  ⚠ Duplicate QR Code

</div>


<!-- ============================================================
     BUTTONS
============================================================ -->

<button
  class="btn-green"
  onclick="selectBackupDrive()"
>
  📁 ตั้งค่า C:\Count stock
</button>


<button
  class="btn-blue"
  onclick="manualBackup()"
>
  💾 Backup CSV
</button>


<button
  class="btn-orange"
  onclick="exportExcelCompatibleCSV()"
>
  📊 Export CSV
</button>


<button
  class="btn-red"
  onclick="clearAll()"
>
  Clear
</button>


<!-- ============================================================
     BACKUP STATUS
============================================================ -->

<div id="backupStatus">

  ⚠ ยังไม่ได้ตั้งค่า Backup Folder

</div>


<!-- ============================================================
     SCAN TABLE
============================================================ -->

<div class="table-container">


<table>


<thead>


<tr>

<th>Row</th>

<th>No</th>

<th>Line</th>

<th>Location</th>

<th>Part</th>

<th>Q'ty</th>

<th>PO</th>

<th>LOT</th>

<th>Remark</th>

<th>Time</th>

<th>Action</th>

</tr>


</thead>


<tbody id="tb"></tbody>


</table>


</div>


<!-- ============================================================
     SUMMARY
============================================================ -->

<div id="summaryWrapper">

  <div id="summary"></div>

</div>


</div>



<script>


/* ============================================================
   GLOBAL DATA
============================================================ */

let data = [];

let scanned = [];

let latestRowFocus = "";


/* ============================================================
   BACKUP SETTINGS
============================================================ */

const BACKUP_FOLDER_NAME =
  "Count stock";


const BACKUP_FILE_PREFIX =
  "Count stock";


/*
   File System Access API

   ใช้สำหรับเขียนไฟล์ลง C:\
*/

let backupRootHandle = null;

let backupFolderHandle = null;


/* ============================================================
   DOM
============================================================ */

const tb =
  document.getElementById("tb");


const qr =
  document.getElementById("qrInput");


const rowSelect =
  document.getElementById("rowSelect");


const backupStatus =
  document.getElementById(
    "backupStatus"
  );


/* ============================================================
   CREATE ROW 1 - 50
============================================================ */

for(
  let i = 1;
  i <= 50;
  i++
){

  rowSelect.innerHTML += `

    <option value="${i}">

      Row ${i}

    </option>

  `;

}


/* ============================================================
   CHECK BROWSER SUPPORT
============================================================ */

function isBackupSupported(){

  return (
    "showDirectoryPicker" in window
  );

}


/* ============================================================
   BACKUP STATUS
============================================================ */

function setBackupStatus(
  message,
  type = ""
){

  backupStatus.textContent =
    message;

  backupStatus.className =
    type;

}


/* ============================================================
   SELECT C:\ DRIVE
     
   ผู้ใช้เลือก C:\ เพียงครั้งแรก
     
   จากนั้นสร้าง:
     
   C:\Count stock
============================================================ */

async function selectBackupDrive(){

  if(
    !isBackupSupported()
  ){

    alert(

      "Browser นี้ไม่รองรับการเขียนไฟล์ลง C:\\ โดยตรง\n\n" +

      "กรุณาใช้ Microsoft Edge หรือ Google Chrome รุ่นใหม่"

    );

    return;

  }


  try{

    /*
       เปิดหน้าต่างเลือก Folder
    */

    backupRootHandle =
      await window.showDirectoryPicker({

        mode:"readwrite"

      });


    /*
       ตรวจสอบ Permission
    */

    const permission =
      await verifyPermission(

        backupRootHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่ได้รับสิทธิ์เขียนไฟล์",

        "error"

      );

      return;

    }


    /*
       สร้าง / เปิด Count stock
       
       ถ้ามีอยู่แล้วจะไม่สร้างซ้ำ
    */

    backupFolderHandle =
      await backupRootHandle
        .getDirectoryHandle(

          BACKUP_FOLDER_NAME,

          {
            create:true
          }

        );


    setBackupStatus(

      "✅ Backup พร้อมใช้งาน → C:\\Count stock",

      "ok"

    );


    /*
       ถ้ามีข้อมูลอยู่แล้ว
       Backup ทันที
    */

    if(
      data.length > 0
    ){

      await createBackupCSV();

    }


    alert(

      "ตั้งค่า Backup สำเร็จ\n\n" +

      "โฟลเดอร์:\n" +

      "C:\\Count stock"

    );


    qr.focus();


  }
  catch(error){

    console.error(
      "Backup folder error:",
      error
    );


    setBackupStatus(

      "❌ ไม่สามารถตั้งค่า Backup Folder ได้",

      "error"

    );

  }

}


/* ============================================================
   VERIFY PERMISSION
============================================================ */

async function verifyPermission(
  handle,
  withWrite
){

  try{

    const options = {};


    if(withWrite){

      options.mode =
        "readwrite";

    }


    if(
      (
        await handle.queryPermission(
          options
        )
      ) === "granted"
    ){

      return true;

    }


    if(
      (
        await handle.requestPermission(
          options
        )
      ) === "granted"
    ){

      return true;

    }


    return false;

  }
  catch(error){

    console.error(
      "Permission error:",
      error
    );

    return false;

  }

}


/* ============================================================
   DATE
     
   YYYYMMDD
============================================================ */

function getDateString(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (

    year +

    month +

    day

  );

}


/* ============================================================
   TIME
     
   HHMMSS
============================================================ */

function getTimeString(){

  const now =
    new Date();


  const hour =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const second =
    String(
      now.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (

    hour +

    minute +

    second

  );

}


/* ============================================================
   UNIQUE FILE NAME
     
   Count stock_20260829_070501.csv
     
   ถ้าซ้ำ:
     
   Count stock_20260829_070501 (1).csv
   Count stock_20260829_070501 (2).csv
============================================================ */

async function getUniqueFileName(){

  const baseName =

    BACKUP_FILE_PREFIX +

    "_" +

    getDateString() +

    "_" +

    getTimeString();


  let fileName =
    baseName +
    ".csv";


  let counter = 1;


  while(true){

    try{

      /*
         ถ้ามีไฟล์อยู่
         getFileHandle จะหาเจอ
      */

      await backupFolderHandle
        .getFileHandle(

          fileName,

          {
            create:false
          }

        );


      /*
         ไฟล์ซ้ำ
      */

      fileName =

        baseName +

        " (" +

        counter +

        ")" +

        ".csv";


      counter++;


    }
    catch(error){

      /*
         ไม่พบไฟล์
         ใช้ชื่อปัจจุบัน
      */

      return fileName;

    }

  }

}


/* ============================================================
   CSV ESCAPE
============================================================ */

function csvEscape(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  let text =
    String(value);


  /*
     CSV ต้อง escape:
     
     "
     ,
     newline
  */

  text =
    text.replace(
      /"/g,
      '""'
    );


  if(
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n") ||
    text.includes("\r")
  ){

    return '"' +
      text +
      '"';

  }


  return text;

}


/* ============================================================
   CREATE CSV CONTENT
     
   UTF-8 BOM
     
   เปิด Excel ภาษาไทยได้ถูกต้อง
============================================================ */

function createCSVContent(){

  let rows = [];


  /* ==========================================================
     HEADER
  ========================================================== */

  rows.push([

    "Row",

    "No",

    "Line",

    "Location",

    "Part",

    "Q'ty",

    "PO",

    "LOT",

    "Remark",

    "Time"

  ]);


  /* ==========================================================
     DATA
  ========================================================== */

  data.forEach(
    (x,i) => {

      rows.push([

        x.row,

        i + 1,

        x.line,

        x.location,

        x.part,

        Number(x.qty) || 0,

        x.po,

        x.lot,

        x.remark,

        x.time

      ]);

    }
  );


  /*
     แปลงเป็น CSV
  */

  const csv =
    rows
      .map(
        row =>
          row
            .map(csvEscape)
            .join(",")
      )
      .join("\r\n");


  /*
     UTF-8 BOM
     
     ช่วยให้ Excel อ่านภาษาไทย
  */

  return "\uFEFF" + csv;

}


/* ============================================================
   CREATE BACKUP CSV
     
   Backup ทุกครั้งที่ Scan
============================================================ */

async function createBackupCSV(){

  /*
     ถ้ายังไม่ได้เลือก C:
     
     ไม่สามารถเขียนไฟล์ได้
  */

  if(
    !backupFolderHandle
  ){

    setBackupStatus(

      "⚠ Scan สำเร็จ แต่ยังไม่ได้ตั้งค่า C:\\Count stock",

      "error"

    );

    return false;

  }


  try{

    /*
       ตรวจสอบ Permission
    */

    const permission =
      await verifyPermission(

        backupFolderHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่มีสิทธิ์เขียนไฟล์ Backup",

        "error"

      );

      return false;

    }


    /*
       สร้างชื่อไฟล์
    */

    const fileName =
      await getUniqueFileName();


    /*
       CSV
    */

    const csv =
      createCSVContent();


    /*
       สร้างไฟล์
    */

    const fileHandle =
      await backupFolderHandle
        .getFileHandle(

          fileName,

          {
            create:true
          }

        );


    /*
       เขียนไฟล์
    */

    const writable =
      await fileHandle
        .createWritable();


    await writable.write(
      csv
    );


    await writable.close();


    /*
       Status
    */

    setBackupStatus(

      "✅ Backup สำเร็จ: " +
      fileName,

      "ok"

    );


    return true;

  }
  catch(error){

    console.error(
      "CSV Backup Error:",
      error
    );


    setBackupStatus(

      "❌ Backup ไม่สำเร็จ: " +
      error.message,

      "error"

    );


    return false;

  }

}


/* ============================================================
   MANUAL BACKUP
============================================================ */

async function manualBackup(){

  if(
    data.length === 0
  ){

    alert(
      "ยังไม่มีข้อมูลสำหรับ Backup"
    );

    return;

  }


  if(
    !backupFolderHandle
  ){

    alert(

      "กรุณาตั้งค่า Backup ก่อน\n\n" +

      "กดปุ่ม:\n" +

      "📁 ตั้งค่า C:\\Count stock"

    );

    return;

  }


  await createBackupCSV();

}


/* ============================================================
   SCAN EVENT
============================================================ */

qr.addEventListener(

  "keypress",

  async function(e){

    if(
      e.key === "Enter"
    ){

      const value =
        qr.value;


      qr.value = "";


      await scan(value);

    }

  }

);


/* ============================================================
   SCAN
============================================================ */

async function scan(v){

  /*
     ปิด Alert
  */

  document
    .getElementById(
      "duplicateAlert"
    )
    .style.display =
    "none";


  /* ==========================================================
     EMPTY
  ========================================================== */

  if(
    !v ||
    !v.trim()
  ){

    qr.focus();

    return;

  }


  v =
    v.trim();


  /* ==========================================================
     DUPLICATE QR
  ========================================================== */

  if(
    scanned.includes(v)
  ){

    document
      .getElementById(
        "duplicateAlert"
      )
      .style.display =
      "block";


    qr.focus();

    return;

  }


  /* ==========================================================
     SAVE SCANNED QR
  ========================================================== */

  scanned.push(v);


  /* ==========================================================
     SPLIT QR
     
     ตัวอย่าง:
     
     200073618
     |
     T
     |
     QC FACT 1
     |
     1
     |
     VG79Y417H01
     |
     53
     |
     2608c640e61d762c4fe1
     |
     9100003596
     |
     1930
     |
     
     d[1] = Line
     d[2] = Location
     d[4] = Part
     d[5] = Q'ty
     d[7] = PO
     d[8] = LOT
  ========================================================== */

  const d =
    v.split("|");


  /* ==========================================================
     ROW
  ========================================================== */

  const row =
    rowSelect.value;


  latestRowFocus =
    row;


  /* ==========================================================
     LINE
  ========================================================== */

  const line =
    d[1] || "-";


  /* ==========================================================
     LOCATION
  ========================================================== */

  const location =
    d[2] || "-";


  /* ==========================================================
     PART
  ========================================================== */

  const part =
    d[4] || "-";


  /* ==========================================================
     Q'TY
  ========================================================== */

  const qty =
    parseInt(
      d[5],
      10
    ) || 0;


  /* ==========================================================
     PO
  ========================================================== */

  const po =
    d[7] || "-";


  /* ==========================================================
     LOT
  ========================================================== */

  const lot =
    d[8] || "-";


  /* ==========================================================
     TIME
  ========================================================== */

  const time =
    new Date()
      .toLocaleString();


  /* ==========================================================
     DUPLICATE PART REMARK
  ========================================================== */

  let duplicateRows = [];


  data.forEach(
    item => {

      if(

        item.part === part &&

        item.row !== row &&

        !duplicateRows.includes(
          item.row
        )

      ){

        duplicateRows.push(
          item.row
        );

      }

    }
  );


  let remark = "";


  if(
    duplicateRows.length > 0
  ){

    remark =

      "ข้อมูล Part item ซ้ำกับแถว " +

      duplicateRows.join(", ");

  }


  /* ==========================================================
     SAVE DATA
  ========================================================== */

  data.push({

    row: row,

    line: line,

    location: location,

    part: part,

    qty: qty,

    po: po,

    lot: lot,

    remark: remark,

    time: time,

    key: v

  });


  /* ==========================================================
     RENDER PAGE
  ========================================================== */

  render();


  /* ==========================================================
     AUTO BACKUP
     
     สำคัญ:
     
     ทุกครั้งที่ Scan สำเร็จ
     จะสร้าง CSV ใหม่ทันที
  ========================================================== */

  await createBackupCSV();


  /* ==========================================================
     FOCUS
  ========================================================== */

  qr.focus();

}


/* ============================================================
   RENDER TABLE
============================================================ */

function render(){

  tb.innerHTML = "";


  data.forEach(
    (x,i) => {

      tb.innerHTML += `

        <tr
          class="${
            i === data.length - 1
            ? "latest"
            : ""
          }"
        >

          <td>
            ${escapeHtml(x.row)}
          </td>


          <td>
            ${i + 1}
          </td>


          <td>
            ${escapeHtml(x.line)}
          </td>


          <td>
            ${escapeHtml(x.location)}
          </td>


          <td>
            ${escapeHtml(x.part)}
          </td>


          <td>
            ${escapeHtml(x.qty)}
          </td>


          <td>
            ${escapeHtml(x.po)}
          </td>


          <td>
            ${escapeHtml(x.lot)}
          </td>


          <td>
            ${escapeHtml(x.remark)}
          </td>


          <td>
            ${escapeHtml(x.time)}
          </td>


          <td>

            <button
              class="del-btn"
              onclick="del(${i})"
            >
              Delete
            </button>

          </td>

        </tr>

      `;

    }
  );


  /* ==========================================================
     AUTO SCROLL
  ========================================================== */

  const tableBox =
    document.querySelector(
      ".table-container"
    );


  if(tableBox){

    tableBox.scrollTop =
      tableBox.scrollHeight;

  }


  /* ==========================================================
     SUMMARY
  ========================================================== */

  renderSummary();

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   DELETE
============================================================ */

async function del(i){

  if(
    i < 0 ||
    i >= data.length
  ){

    return;

  }


  const confirmDelete =
    confirm(
      "ต้องการลบรายการนี้หรือไม่?"
    );


  if(!confirmDelete){

    return;

  }


  /*
     เอา QR ออกจาก scanned
  */

  scanned =
    scanned.filter(
      x =>
        x !== data[i].key
    );


  /*
     ลบข้อมูล
  */

  data.splice(
    i,
    1
  );


  /*
     Render
  */

  render();


  /*
     Backup สถานะล่าสุด
  */

  if(
    backupFolderHandle
  ){

    await createBackupCSV();

  }


  qr.focus();

}


/* ============================================================
   SUMMARY
     
     Group:
       Row + Part
     
     Unit:
       จำนวนครั้งที่ Scan
     
     Q'ty:
       Unit × Q'ty ต่อ 1 Scan
     
     ตัวอย่าง:
     
       Scan 1:
         Q'ty = 53
     
       Scan 2:
         Q'ty = 53
     
       Scan 3:
         Q'ty = 53
     
       Unit = 3
     
       Summary Q'ty:
         3 × 53 = 159
     
     หากแต่ละ Scan Q'ty ไม่เท่ากัน
     จะรวมตามจำนวนจริง:
     
       53 + 100 + 20 = 173
============================================================ */

function renderSummary(){

  let summaryData = {};


  /* ==========================================================
     GROUP
  ========================================================== */

  data.forEach(
    x => {

      const row =
        String(
          x.row
        );


      const part =
        String(
          x.part || "-"
        ).trim();


      if(
        !summaryData[row]
      ){

        summaryData[row] = {};

      }


      if(
        !summaryData[row][part]
      ){

        summaryData[row][part] = {

          unit:0,

          qtyPerUnit:0,

          totalQty:0

        };

      }


      /* ------------------------------------------------------
         UNIT
      ------------------------------------------------------ */

      summaryData[row][part]
        .unit++;


      /* ------------------------------------------------------
         Q'TY ต่อ Unit
         
         ถ้า Scan แรก Q'ty = 53
         เก็บไว้เป็น 53
      ------------------------------------------------------ */

      const currentQty =
        Number(x.qty) || 0;


      /*
         ถ้าเป็น Scan แรก
         กำหนด Qty ต่อ Unit
      */

      if(
        summaryData[row][part]
          .unit === 1
      ){

        summaryData[row][part]
          .qtyPerUnit =
          currentQty;

      }


      /* ------------------------------------------------------
         TOTAL QTY
         
         Unit × Q'ty
         
         ถ้าแต่ละ Scan Q'ty เท่ากัน
         จะเท่ากับ Unit × Q'ty
      ------------------------------------------------------ */

      summaryData[row][part]
        .totalQty +=
        currentQty;

    }
  );


  /* ==========================================================
     EMPTY
  ========================================================== */

  if(
    Object.keys(
      summaryData
    ).length === 0
  ){

    document
      .getElementById(
        "summary"
      )
      .innerHTML =
      "";

    return;

  }


  /* ==========================================================
     HTML
  ========================================================== */

  let html = "";


  Object.keys(
    summaryData
  )

  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )

  .forEach(
    r => {

      let totalUnit = 0;

      let totalQty = 0;


      html += `

        <div
          class="
            summary-box
            ${
              latestRowFocus == r
              ? "summary-focus"
              : ""
            }
          "
        >

          <div
            class="summary-title"
          >

            📍 Row ${escapeHtml(r)}

          </div>


          <table
            style="
              width:100%;
              border-collapse:collapse;
            "
          >


            <thead>

              <tr>

                <th>
                  Part
                </th>

                <th>
                  Unit
                </th>

                <th>
                  Q'ty / Unit
                </th>

                <th>
                  Total Q'ty
                </th>

              </tr>

            </thead>


            <tbody>

      `;


      /* ======================================================
         PARTS
      ====================================================== */

      Object.keys(
        summaryData[r]
      )

      .forEach(
        p => {

          const unit =
            summaryData[r][p]
              .unit;


          const qtyPerUnit =
            summaryData[r][p]
              .qtyPerUnit;


          /*
             Total Qty
          */

          const totalQtyPart =
            summaryData[r][p]
              .totalQty;


          totalUnit +=
            unit;


          totalQty +=
            totalQtyPart;


          html += `

            <tr>

              <td>
                ${escapeHtml(p)}
              </td>


              <td
                style="
                  text-align:center;
                "
              >
                ${unit}
              </td>


              <td
                style="
                  text-align:center;
                "
              >
                ${qtyPerUnit}
              </td>


              <td
                style="
                  text-align:center;
                  font-weight:bold;
                "
              >
                ${totalQtyPart}
              </td>

            </tr>

          `;

        }
      );


      /* ======================================================
         TOTAL
      ====================================================== */

      html += `

            </tbody>


            <tfoot>

              <tr>

                <td>
                  <b>TOTAL</b>
                </td>


                <td
                  style="
                    text-align:center;
                  "
                >
                  <b>
                    ${totalUnit}
                  </b>
                </td>


                <td
                  style="
                    text-align:center;
                  "
                >
                  -
                </td>


                <td
                  style="
                    text-align:center;
                  "
                >
                  <b>
                    ${totalQty}
                  </b>
                </td>

              </tr>

            </tfoot>


          </table>


        </div>

      `;

    }
  );


  /* ==========================================================
     DISPLAY
  ========================================================== */

  document
    .getElementById(
      "summary"
    )
    .innerHTML =
    html;

}

   CLEAR

============================================================ */

function clearAll(){

  const confirmClear =
    confirm(

      "ต้องการ Clear ข้อมูลบนหน้าเว็บหรือไม่?\n\n" +

      "ไฟล์ Backup CSV เดิมจะไม่ถูกลบ"

    );


  if(!confirmClear){

    return;

  }


  data = [];

  scanned = [];

  latestRowFocus = "";


  tb.innerHTML =
    "";


  document
    .getElementById(
      "summary"
    )
    .innerHTML =
    "";


  document
    .getElementById(
      "duplicateAlert"
    )
    .style.display =
    "none";


  setBackupStatus(

    "⚠ Clear หน้าเว็บแล้ว — Backup CSV เดิมยังอยู่",

    "ok"

  );


  qr.focus();

}


/* ============================================================
   EXPORT CSV
     
     ดาวน์โหลด CSV ผ่าน Browser
     
     ใช้เมื่อผู้ใช้ต้องการ Export
============================================================ */

function exportExcelCompatibleCSV(){

  if(
    data.length === 0
  ){

    alert(
      "ยังไม่มีข้อมูลสำหรับ Export"
    );

    return;

  }


  const csv =
    createCSVContent();


  const blob =
    new Blob(

      [csv],

      {
        type:
          "text/csv;charset=utf-8;"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =

    BACKUP_FILE_PREFIX +

    "_" +

    getDateString() +

    "_" +

    getTimeString() +

    ".csv";


  document.body.appendChild(a);


  a.click();


  document.body.removeChild(a);


  URL.revokeObjectURL(url);

}
