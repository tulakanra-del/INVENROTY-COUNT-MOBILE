}

  border-radius:10px;

  border:1px solid #cbd5e1;

  box-sizing:border-box;

   BUTTON
============================================================ */

  padding:12px 16px;

  border:none;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

  margin-right:6px;

}


.btn-blue{

  background:#2563eb;

  color:#fff;

}


.btn-green{

  background:#16a34a;

  color:#fff;

}


.btn-orange{

  background:#f59e0b;

  color:#fff;

}


.btn-red{

  background:#dc2626;

  color:#fff;

}


.del-btn{

  background:#ef4444;

  color:#fff;

  padding:6px 10px;

  border-radius:6px;

  font-size:12px;

   BACKUP STATUS
============================================================ */

  padding:10px 12px;

  background:#f1f5f9;

  border-radius:8px;

  font-size:13px;

  color:#475569;

}

  background:#dcfce7;

  color:#166534;

}


#backupStatus.error{

  background:#fee2e2;

  color:#991b1b;

}


/* ============================================================
   TABLE
============================================================ */

.table-container{

  margin-top:20px;

  max-height:420px;

  overflow:auto;

  border:1px solid #ddd;

  border-radius:10px;

table{

  width:100%;

}

th{

  background:#f1f5f9;

   SUMMARY
============================================================ */

#summaryWrapper{

  border:1px solid #ddd;

  overflow-y:auto;

  border:2px solid #e5e7eb;

/* ============================================================
   ALERT
============================================================ */

  display:none;

  background:#fee2e2;

  color:#991b1b;

  padding:12px;

  border-radius:10px;

  margin-bottom:15px;

  font-weight:bold;

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:700px){

  .scan-row{

    flex-direction:column;

  }

  .container{

    padding:15px;

  }

}

<body>


<div class="container">


<h2>
  📦 INVENTORY COUNT SYSTEM
</h2>


<!-- ============================================================
     SCAN INPUT
============================================================ -->

<div class="scan-row">


<select id="rowSelect"></select>


<input
  id="qrInput"
  placeholder="Scan QR Code..."
  autofocus
>


</div>


<!-- ============================================================
     DUPLICATE ALERT
============================================================ -->

<div id="duplicateAlert">

  ⚠ Duplicate QR Code

</div>


<!-- ============================================================
     BUTTONS
============================================================ -->

<button
  class="btn-green"
  onclick="selectBackupDrive()"
>
  📁 ตั้งค่า C:\Count stock
</button>


<button
  class="btn-blue"
  onclick="manualBackup()"
>
  💾 Backup CSV
</button>


<button
  class="btn-orange"
  onclick="exportCSV()"
>
  📊 Export CSV
</button>


<button
  class="btn-red"
  onclick="clearAll()"
>
  🗑 Clear
</button>


<!-- ============================================================
     BACKUP STATUS
============================================================ -->

<div id="backupStatus">

  ⚠ กรุณาตั้งค่า Backup Folder

</div>


<!-- ============================================================
     SCAN TABLE
============================================================ -->

<div class="table-container">


<table>


<thead>

<tr>

<th>Row</th>

<th>No</th>

<th>Line</th>

<th>Location</th>

<th>Part</th>

<th>Q'ty</th>

<th>PO</th>

<th>LOT</th>

<th>Remark</th>

<th>Time</th>

<th>Action</th>

</tr>

</thead>


<tbody id="tb"></tbody>


</table>


</div>


<!-- ============================================================
     SUMMARY
============================================================ -->

<div id="summaryWrapper">

  <div id="summary"></div>

</div>


</div>



<script>


/* ============================================================
   GLOBAL
============================================================ */

let data = [];

let scanned = [];

let latestRowFocus = "";


/* ============================================================
   BACKUP
============================================================ */

const BACKUP_FOLDER_NAME =
  "Count stock";


const BACKUP_FILE_PREFIX =
  "Count stock";


let backupRootHandle = null;

let backupFolderHandle = null;


/* ============================================================
   DOM
============================================================ */

const tb =
  document.getElementById("tb");


const qr =
  document.getElementById("qrInput");


const rowSelect =
  document.getElementById("rowSelect");


const backupStatus =
  document.getElementById(
    "backupStatus"
  );


/* ============================================================
   CREATE ROW 1 - 50
============================================================ */

for(
  let i = 1;
  i <= 50;
  i++
){

  rowSelect.innerHTML += `

    <option value="${i}">
      Row ${i}
    </option>

  `;

}


/* ============================================================
   BROWSER SUPPORT
============================================================ */

function isBackupSupported(){

  return (
    "showDirectoryPicker" in window
  );

}


/* ============================================================
   STATUS
============================================================ */

function setBackupStatus(
  message,
  type = ""
){

  backupStatus.textContent =
    message;

  backupStatus.className =
    type;

}


/* ============================================================
   SELECT C:
============================================================ */

async function selectBackupDrive(){

  if(
    !isBackupSupported()
  ){

    alert(

      "Browser นี้ไม่รองรับการเขียนไฟล์ลง C:\\\n\n" +

      "กรุณาใช้ Google Chrome หรือ Microsoft Edge รุ่นใหม่"

    );

    return;

  }


  try{

    /*
       ให้ผู้ใช้เลือก C:\
    */

    backupRootHandle =
      await window.showDirectoryPicker({

        mode:"readwrite"

      });


    /*
       ขอสิทธิ์เขียน
    */

    const permission =
      await verifyPermission(

        backupRootHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่ได้รับสิทธิ์เขียนไฟล์",

        "error"

      );

      return;

    }


    /*
       เปิด / สร้าง Count stock
    */

    backupFolderHandle =
      await backupRootHandle
        .getDirectoryHandle(

          BACKUP_FOLDER_NAME,

          {
            create:true
          }

        );


    setBackupStatus(

      "✅ Backup พร้อมใช้งาน → C:\\Count stock",

      "ok"

    );


    alert(

      "ตั้งค่า Backup สำเร็จ\n\n" +

      "ระบบจะบันทึกข้อมูลรายวันใน\n" +

      "C:\\Count stock"

    );


    qr.focus();

  }
  catch(error){

    console.error(error);


    setBackupStatus(

      "❌ ไม่สามารถตั้งค่า Backup Folder ได้",

      "error"

    );

  }

}


/* ============================================================
   PERMISSION
============================================================ */

async function verifyPermission(
  handle,
  withWrite
){

  try{

    const options = {};


    if(withWrite){

      options.mode =
        "readwrite";

    }


    if(
      (
        await handle.queryPermission(
          options
        )
      ) === "granted"
    ){

      return true;

    }


    if(
      (
        await handle.requestPermission(
          options
        )
      ) === "granted"
    ){

      return true;

    }


    return false;

  }
  catch(error){

    console.error(error);

    return false;

  }

}


/* ============================================================
   DATE
     
   YYYYMMDD
     
   ตัวอย่าง:
   20260829
============================================================ */

function getDateString(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day

  );

}


/* ============================================================
   DISPLAY DATE TIME
============================================================ */

function getDisplayDateTime(){

  return new Date()
    .toLocaleString();

}


/* ============================================================
   DAILY FILE NAME
     
   ไม่มีเวลา
     
   Count stock_20260829.csv
============================================================ */

function getDailyFileName(){

  return (

    BACKUP_FILE_PREFIX +

    "_" +

    getDateString() +

    ".csv"

  );

}


/* ============================================================
   CSV ESCAPE
============================================================ */

function csvEscape(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  let text =
    String(value);


  text =
    text.replace(
      /"/g,
      '""'
    );


  if(

    text.includes(",") ||

    text.includes('"') ||

    text.includes("\n") ||

    text.includes("\r")

  ){

    return '"' +
      text +
      '"';

  }


  return text;

}


/* ============================================================
   CREATE CSV ROW
     
   1 Scan = 1 Row
============================================================ */

function createCSVRow(
  x
){

  return [

    x.row,

    x.no,

    x.line,

    x.location,

    x.part,

    Number(x.qty) || 0,

    x.po,

    x.lot,

    x.remark,

    x.time

  ]

  .map(csvEscape)

  .join(",");

}


/* ============================================================
   CREATE CSV HEADER
============================================================ */

function createCSVHeader(){

  return [

    "Row",

    "No",

    "Line",

    "Location",

    "Part",

    "Q'ty",

    "PO",

    "LOT",

    "Remark",

    "Time"

  ]

  .map(csvEscape)

  .join(",");

}


/* ============================================================
   BACKUP ONE SCAN
     
   สำคัญ:
     
   ระบบจะเปิดไฟล์ของ "วันนี้"
     
   ถ้ามีไฟล์:
       อ่านข้อมูลเดิม
       แล้วเพิ่มข้อมูลใหม่ต่อท้าย
     
   ถ้าไม่มี:
       สร้างไฟล์ใหม่
============================================================ */

async function backupScan(
  scanData
){

  if(
    !backupFolderHandle
  ){

    setBackupStatus(

      "⚠ Scan สำเร็จ แต่ยังไม่ได้ตั้งค่า C:\\Count stock",

      "error"

    );

    return false;

  }


  try{

    /*
       ตรวจ Permission
    */

    const permission =
      await verifyPermission(

        backupFolderHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่มีสิทธิ์เขียน Backup",

        "error"

      );

      return false;

    }


    /*
       ชื่อไฟล์รายวัน
    */

    const fileName =
      getDailyFileName();


    /*
       ตรวจว่าไฟล์วันนี้มีหรือยัง
    */

    let fileHandle;

    let fileExists = true;


    try{

      fileHandle =
        await backupFolderHandle
          .getFileHandle(

            fileName,

            {
              create:false
            }

          );

    }
    catch(error){

      fileExists = false;

    }


    /*
       ========================================================
       กรณีมีไฟล์อยู่แล้ว
       ========================================================
    */

    if(fileExists){

      const file =
        await fileHandle
          .getFile();


      /*
         อ่านข้อมูลเดิม
      */

      const oldText =
        await file.text();


      /*
         สร้าง Row ใหม่
      */

      const newRow =
        createCSVRow(
          scanData
        );


      /*
         ถ้ามีข้อมูลอยู่แล้ว
         ให้เพิ่มต่อท้าย
      */

      let finalText =
        oldText;


      if(
        !finalText.endsWith("\n") &&
        finalText.length > 0
      ){

        finalText += "\r\n";

      }


      finalText +=
        newRow +
        "\r\n";


      /*
         เขียนกลับทั้งไฟล์
      */

      const writable =
        await fileHandle
          .createWritable();


      await writable.write(
        "\uFEFF" +
        finalText.replace(
          /^\uFEFF/,
          ""
        )
      );


      await writable.close();

    }


    /*
       ========================================================
       กรณียังไม่มีไฟล์
       ========================================================
    */

    else{

      fileHandle =
        await backupFolderHandle
          .getFileHandle(

            fileName,

            {
              create:true
            }

          );


      const csvText =

        "\uFEFF" +

        createCSVHeader() +

        "\r\n" +

        createCSVRow(
          scanData
        ) +

        "\r\n";


      const writable =
        await fileHandle
          .createWritable();


      await writable.write(
        csvText
      );


      await writable.close();

    }


    /*
       Status
    */

    setBackupStatus(

      "✅ Backup สำเร็จ → " +
      "C:\\Count stock\\" +
      fileName,

      "ok"

    );


    return true;

  }
  catch(error){

    console.error(
      "Backup error:",
      error
    );


    setBackupStatus(

      "❌ Backup ไม่สำเร็จ: " +
      error.message,

      "error"

    );


    return false;

  }

}


/* ============================================================
   MANUAL BACKUP
     
   Manual Backup จะสร้าง/อัปเดตไฟล์รายวัน
     
   แต่จะไม่เพิ่มข้อมูลซ้ำ
   เพราะข้อมูลทั้งหมดถูก Backup ตอน Scan แล้ว
     
   จึงใช้สำหรับตรวจสอบสถานะ
============================================================ */

async function manualBackup(){

  if(
    data.length === 0
  ){

    alert(
      "ยังไม่มีข้อมูลสำหรับ Backup"
    );

    return;

  }


  if(
    !backupFolderHandle
  ){

    alert(

      "กรุณากด\n" +

      "📁 ตั้งค่า C:\\Count stock\n\n" +

      "ก่อนใช้งาน Backup"

    );

    return;

  }


  /*
     Manual Backup:
     สร้าง Snapshot ของข้อมูลปัจจุบัน
     
     ใช้ชื่อไฟล์แยกไม่ได้
     เพราะต้องการรายวัน
     
     ดังนั้นจะแจ้งว่า
     Backup ถูกทำอัตโนมัติทุก Scan
  */

  alert(

    "ข้อมูลถูก Backup อัตโนมัติทุกครั้งที่ Scan แล้ว\n\n" +

    "ไฟล์วันนี้:\n" +

    getDailyFileName()

  );

}


/* ============================================================
   SCAN EVENT
============================================================ */

qr.addEventListener(

  "keypress",

  async function(e){

    if(
      e.key === "Enter"
    ){

      const value =
        qr.value;


      qr.value = "";


      await scan(value);

    }

  }

);


/* ============================================================
   SCAN FUNCTION
============================================================ */

async function scan(v){

  document
    .getElementById(
      "duplicateAlert"
    )
    .style.display =
    "none";


  /* ==========================================================
     EMPTY
  ========================================================== */

  if(
    !v ||
    !v.trim()
  ){

    qr.focus();

    return;

  }


  v =
    v.trim();


  /* ==========================================================
     DUPLICATE QR
  ========================================================== */

  if(
    scanned.includes(v)
  ){

    document
      .getElementById(
        "duplicateAlert"
      )
      .style.display =
      "block";


    qr.focus();

    return;

  }


  /* ==========================================================
     SAVE QR
  ========================================================== */

  scanned.push(v);


  /* ==========================================================
     SPLIT QR
     
     ตัวอย่าง:
     
     200073618
     |
     T
     |
     QC FACT 1
     |
     1
     |
     VG79Y417H01
     |
     53
     |
     2608c640e61d762c4fe1
     |
     9100003596
     |
     1930
     |
     
     d[1] = Line
     d[2] = Location
     d[4] = Part
     d[5] = Q'ty
     d[7] = PO
     d[8] = LOT
  ========================================================== */

  const d =
    v.split("|");


  /* ==========================================================
     ROW
  ========================================================== */

  const row =
    rowSelect.value;


  latestRowFocus =
    row;


  /* ==========================================================
     DATA
  ========================================================== */

  const line =
    d[1] || "-";


  const location =
    d[2] || "-";


  const part =
    d[4] || "-";


  const qty =
    parseInt(
      d[5],
      10
    ) || 0;


  const po =
    d[7] || "-";


  const lot =
    d[8] || "-";


  const time =
    getDisplayDateTime();


  /* ==========================================================
     DUPLICATE PART REMARK
  ========================================================== */

  let duplicateRows = [];


  data.forEach(
    item => {

      if(

        item.part === part &&

        item.row !== row &&

        !duplicateRows.includes(
          item.row
        )

      ){

        duplicateRows.push(
          item.row
        );

      }

    }
  );


  let remark = "";


  if(
    duplicateRows.length > 0
  ){

    remark =

      "ข้อมูล Part item ซ้ำกับแถว " +

      duplicateRows.join(", ");

  }


  /* ==========================================================
     CREATE SCAN DATA
  ========================================================== */

  const scanData = {

    row: row,

    no:
      data.length + 1,

    line: line,

    location: location,

    part: part,

    qty: qty,

    po: po,

    lot: lot,

    remark: remark,

    time: time,

    key: v

  };


  /* ==========================================================
     SAVE TO MEMORY
  ========================================================== */

  data.push(
    scanData
  );


  /* ==========================================================
     RENDER
  ========================================================== */

  render();


  /* ==========================================================
     AUTO BACKUP
     
     ทุก Scan สำเร็จ
     → เพิ่มลงไฟล์รายวัน
============================================================ */

  await backupScan(
    scanData
  );


  /* ==========================================================
     FOCUS
  ========================================================== */

  qr.focus();

}


/* ============================================================
   RENDER TABLE
============================================================ */

function render(){

  tb.innerHTML = "";


  data.forEach(
    (x,i) => {

      tb.innerHTML += `

        <tr
          class="${
            i === data.length - 1
            ? "latest"
            : ""
          }"
        >

          <td>
            ${escapeHtml(x.row)}
          </td>


          <td>
            ${i + 1}
          </td>


          <td>
            ${escapeHtml(x.line)}
          </td>


          <td>
            ${escapeHtml(x.location)}
          </td>


          <td>
            ${escapeHtml(x.part)}
          </td>


          <td>
            ${escapeHtml(x.qty)}
          </td>


          <td>
            ${escapeHtml(x.po)}
          </td>


          <td>
            ${escapeHtml(x.lot)}
          </td>


          <td>
            ${escapeHtml(x.remark)}
          </td>


          <td>
            ${escapeHtml(x.time)}
          </td>


          <td>

            <button
              class="del-btn"
              onclick="del(${i})"
            >
              Delete
            </button>

          </td>

        </tr>

      `;

    }
  );


  /* ==========================================================
     AUTO SCROLL
  ========================================================== */

  const tableBox =
    document.querySelector(
      ".table-container"
    );


  if(tableBox){

    tableBox.scrollTop =
      tableBox.scrollHeight;

  }


  /* ==========================================================
     SUMMARY
  ========================================================== */

  renderSummary();

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   DELETE
     
   Delete หน้าเว็บ
     
   หลัง Delete จะ Backup Snapshot ไม่ได้เพิ่มซ้ำ
   เพราะไฟล์รายวันเป็น Audit Log ของการ Scan
     
   ดังนั้น Backup จะยังเก็บข้อมูลที่เคย Scan ไว้
============================================================ */

async function del(i){

  if(
    i < 0 ||
    i >= data.length
  ){

    return;

  }


  const confirmed =
    confirm(

      "⚠ ต้องการลบรายการนี้หรือไม่?\n\n" +

      "ข้อมูลจะถูกลบออกจากหน้าเว็บ\n" +

      "แต่ข้อมูล Backup CSV ที่เคยบันทึกแล้วจะไม่ถูกลบ"

    );


  if(!confirmed){

    return;

  }


  scanned =
    scanned.filter(
      x =>
        x !== data[i].key
    );


  data.splice(
    i,
    1
  );


  render();


  qr.focus();

}


/* ============================================================
   SUMMARY
     
     Unit = จำนวนครั้งที่ Scan
     
     Q'ty / Unit = Q'ty จาก QR
     
     Total Q'ty = ผลรวม Q'ty
     
     ถ้า Q'ty เท่ากัน:
     
       Unit × Q'ty
     
     เช่น:
     
       Unit = 3
       Q'ty = 53
       
       Total = 3 × 53
             = 159
============================================================ */

function renderSummary(){

  let summaryData = {};


  data.forEach(
    x => {

      const row =
        String(
          x.row
        );


      const part =
        String(
          x.part || "-"
        ).trim();


      if(
        !summaryData[row]
      ){

        summaryData[row] = {};

      }


      if(
        !summaryData[row][part]
      ){

        summaryData[row][part] = {

          unit:0,

          qtyPerUnit:0,

          totalQty:0

        };

      }


      /* ------------------------------------------------------
         UNIT
      ------------------------------------------------------ */

      summaryData[row][part]
        .unit++;


      /* ------------------------------------------------------
         QTY
      ------------------------------------------------------ */

      const currentQty =
        Number(x.qty) || 0;


      /*
         เก็บ Q'ty ของ Scan แรก
      */

      if(
        summaryData[row][part]
          .unit === 1
      ){

        summaryData[row][part]
          .qtyPerUnit =
          currentQty;

      }


      /*
         Total Q'ty
         
         = รวม Q'ty ทุก Scan
         
         ถ้า Q'ty เท่ากัน:
         
         Unit × Q'ty
      */

      summaryData[row][part]
        .totalQty +=
        currentQty;

    }
  );


  /* ==========================================================
     EMPTY
  ========================================================== */

  if(
    Object.keys(
      summaryData
    ).length === 0
  ){

    document
      .getElementById(
        "summary"
      )
      .innerHTML =
      "";

    return;

  }


  /* ==========================================================
     BUILD HTML
  ========================================================== */

  let html = "";


  Object.keys(
    summaryData
  )

  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )

  .forEach(
    r => {

      let totalUnit = 0;

      let totalQty = 0;


      html += `

        <div
          class="
            summary-box
            ${
              latestRowFocus == r
              ? "summary-focus"
              : ""
            }
          "
        >

          <div
            class="summary-title"
          >

            📍 Row ${escapeHtml(r)}

          </div>


          <table
            style="
              width:100%;
              border-collapse:collapse;
            "
          >


            <thead>

              <tr>

                <th>
                  Part
                </th>

                <th>
                  Unit
                </th>

                <th>
                  Q'ty / Unit
                </th>

                <th>
                  Total Q'ty
                </th>

              </tr>

            </thead>


            <tbody>

      `;


      /* ======================================================
         PART
      ====================================================== */

      Object.keys(
        summaryData[r]
      )

      .forEach(
        p => {

          const unit =
            summaryData[r][p]
              .unit;


          const qtyPerUnit =
            summaryData[r][p]
              .qtyPerUnit;


          const totalQtyPart =
            summaryData[r][p]
              .totalQty;


          totalUnit +=
            unit;


          totalQty +=
            totalQtyPart;


          html += `

            <tr>

              <td>
                ${escapeHtml(p)}
              </td>


              <td
                style="
                  text-align:center;
                "
              >

                ${unit}

              </td>


              <td
                style="
                  text-align:center;
                "
              >

                ${qtyPerUnit}

              </td>


              <td
                style="
                  text-align:center;
                  font-weight:bold;
                "
              >

                ${totalQtyPart}

              </td>

            </tr>

          `;

        }
      );


      /* ======================================================
         TOTAL
      ====================================================== */

      html += `

            </tbody>


            <tfoot>

              <tr>

                <td>
                  <b>TOTAL</b>
                </td>


                <td
                  style="
                    text-align:center;
                  "
                >

                  <b>
                    ${totalUnit}
                  </b>

                </td>


                <td
                  style="
                    text-align:center;
                  "
                >

                  -

                </td>


                <td
                  style="
                    text-align:center;
                  "
                >

                  <b>
                    ${totalQty}
                  </b>

                </td>

              </tr>

            </tfoot>


          </table>


        </div>

      `;

    }
  );


  document
    .getElementById(
      "summary"
    )
    .innerHTML =
    html;

}

}


/* ============================================================
   EXPORT CSV
     
   Export ข้อมูลที่อยู่หน้าเว็บ
============================================================ */

function exportCSV(){

  if(
    data.length === 0
  ){

    alert(
      "ยังไม่มีข้อมูลสำหรับ Export"
    );

    return;

  }


  let rows = [];


  rows.push(

    [

      "Row",

      "No",

      "Line",

      "Location",

      "Part",

      "Q'ty",

      "PO",

      "LOT",

      "Remark",

      "Time"

    ]

    .map(csvEscape)

    .join(",")

  );


  data.forEach(
    (x,i) => {

      rows.push(

        [

          x.row,

          i + 1,

          x.line,

          x.location,

          x.part,

          Number(x.qty) || 0,

          x.po,

          x.lot,

          x.remark,

          x.time

        ]

        .map(csvEscape)

        .join(",")

      );

    }
  );


  const csv =

    "\uFEFF" +

    rows.join("\r\n");


  const blob =
    new Blob(

      [csv],

      {
        type:
          "text/csv;charset=utf-8;"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =

    BACKUP_FILE_PREFIX +

    "_" +

    getDateString() +

    "_Export.csv";


  document.body.appendChild(
    a
  );


  a.click();


  document.body.removeChild(
    a
  );


  URL.revokeObjectURL(
    url
  );

}
