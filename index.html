<script>


/* ============================================================
   GLOBAL DATA
============================================================ */

let data = [];

let scanned = [];

let latestRowFocus = "";


/* ============================================================
   BACKUP
============================================================ */

const BACKUP_FOLDER_NAME =
  "Count stock";


const BACKUP_FILE_PREFIX =
  "Stock Counting";


let backupRootHandle = null;

let backupFolderHandle = null;


/* ============================================================
   DOM
============================================================ */

const tb =
  document.getElementById("tb");


const qr =
  document.getElementById("qrInput");


const rowSelect =
  document.getElementById("rowSelect");


const backupStatus =
  document.getElementById("backupStatus");


/* ============================================================
   CREATE ROW 1 - 50
============================================================ */

for(
  let i = 1;
  i <= 50;
  i++
){

  rowSelect.innerHTML += `

    <option value="${i}">
      Row ${i}
    </option>

  `;

}


/* ============================================================
   BROWSER SUPPORT
============================================================ */

function isBackupSupported(){

  return (
    "showDirectoryPicker" in window
  );

}


/* ============================================================
   BACKUP STATUS
============================================================ */

function setBackupStatus(
  message,
  type = ""
){

  backupStatus.textContent =
    message;

  backupStatus.className =
    type;

}


/* ============================================================
   SELECT BACKUP DRIVE
============================================================ */

async function selectBackupDrive(){

  if(
    !isBackupSupported()
  ){

    alert(

      "Browser นี้ไม่รองรับการ Backup ลง C:\\\n\n" +

      "กรุณาใช้ Google Chrome หรือ Microsoft Edge รุ่นใหม่"

    );

    return;

  }


  try{

    backupRootHandle =
      await window.showDirectoryPicker({

        mode:"readwrite"

      });


    const permission =
      await verifyPermission(

        backupRootHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่ได้รับสิทธิ์เขียนไฟล์",

        "error"

      );

      return;

    }


    /* ========================================================
       สร้าง Count stock ถ้ายังไม่มี
    ======================================================== */

    backupFolderHandle =
      await backupRootHandle
        .getDirectoryHandle(

          BACKUP_FOLDER_NAME,

          {
            create:true
          }

        );


    setBackupStatus(

      "✅ Backup พร้อมใช้งาน → Count stock",

      "ok"

    );


    alert(

      "ตั้งค่า Backup สำเร็จ\n\n" +

      "ระบบจะใช้ Folder Count stock\n" +

      "และบันทึกต่อในไฟล์ของแต่ละวัน"

    );


    qr.focus();

  }

  catch(error){

    console.error(
      error
    );


    backupRootHandle = null;

    backupFolderHandle = null;


    setBackupStatus(

      "❌ ไม่สามารถตั้งค่า Backup Folder ได้: " +

      error.message,

      "error"

    );

  }

}


/* ============================================================
   VERIFY PERMISSION
============================================================ */

async function verifyPermission(
  handle,
  withWrite
){

  try{

    const options = {};


    if(withWrite){

      options.mode =
        "readwrite";

    }


    if(

      await handle
        .queryPermission(
          options
        ) === "granted"

    ){

      return true;

    }


    if(

      await handle
        .requestPermission(
          options
        ) === "granted"

    ){

      return true;

    }


    return false;

  }

  catch(error){

    console.error(
      error
    );

    return false;

  }

}


/* ============================================================
   DATE
============================================================ */

function getDateString(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day

  );

}


/* ============================================================
   DISPLAY TIME
============================================================ */

function getDisplayDateTime(){

  return new Date()
    .toLocaleString();

}


/* ============================================================
   DAILY FILE NAME
============================================================ */

function getDailyFileName(){

  return (

    BACKUP_FILE_PREFIX +

    "_" +

    getDateString() +

    ".csv"

  );

}


/* ============================================================
   CSV ESCAPE
============================================================ */

function csvEscape(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  let text =
    String(value);


  text =
    text.replace(
      /"/g,
      '""'
    );


  if(

    text.includes(",") ||

    text.includes('"') ||

    text.includes("\n") ||

    text.includes("\r")

  ){

    return '"' +
      text +
      '"';

  }


  return text;

}


/* ============================================================
   CSV HEADER
     
     Q'ty ยังคงอยู่ใน CSV
============================================================ */

function createCSVHeader(){

  return [

    "Row",

    "No",

    "Production Order",

    "Seq",

    "Line",

    "Location",

    "Part",

    "Q'ty",

    "PO",

    "PO ITEM",

    "Remark",

    "Time"

  ]

  .map(
    csvEscape
  )

  .join(",");

}


/* ============================================================
   CSV ROW
============================================================ */

function createCSVRow(
  x
){

  return [

    x.row,

    x.no,

    x.productionOrder,

    x.seq,

    x.line,

    x.location,

    x.part,

    Number(x.qty) || 0,

    x.po,

    x.poItem,

    x.remark,

    x.time

  ]

  .map(
    csvEscape
  )

  .join(",");

}


/* ============================================================
   AUTO BACKUP
============================================================ */

async function backupScan(
  scanData
){

  if(
    !backupFolderHandle
  ){

    setBackupStatus(

      "⚠ Scan สำเร็จ แต่ยังไม่ได้ตั้งค่า Backup",

      "error"

    );

    return false;

  }


  try{

    const permission =
      await verifyPermission(

        backupFolderHandle,

        true

      );


    if(!permission){

      setBackupStatus(

        "❌ ไม่มีสิทธิ์เขียนไฟล์ Backup",

        "error"

      );

      return false;

    }


    const fileName =
      getDailyFileName();


    let fileHandle = null;

    let fileExists = true;


    /* ========================================================
       หาไฟล์ของวันนี้
    ======================================================== */

    try{

      fileHandle =
        await backupFolderHandle
          .getFileHandle(

            fileName,

            {
              create:false
            }

          );

    }

    catch(error){

      fileExists = false;

    }


    /* ========================================================
       ถ้ามีไฟล์แล้ว
       เพิ่มข้อมูลต่อท้ายไฟล์เดิม
    ======================================================== */

    if(

      fileExists &&
      fileHandle

    ){

      const file =
        await fileHandle.getFile();


      let oldText =
        await file.text();


      oldText =
        oldText.replace(
          /^\uFEFF/,
          ""
        );


      const newRow =
        createCSVRow(
          scanData
        );


      if(

        oldText.length > 0 &&

        !oldText.endsWith("\n") &&

        !oldText.endsWith("\r")

      ){

        oldText +=
          "\r\n";

      }


      const finalText =

        "\uFEFF" +

        oldText +

        newRow +

        "\r\n";


      const writable =
        await fileHandle
          .createWritable();


      await writable.write(
        finalText
      );


      await writable.close();


      setBackupStatus(

        "✅ Backup สำเร็จ → " +

        fileName,

        "ok"

      );


      return true;

    }


    /* ========================================================
       ถ้ายังไม่มีไฟล์
       สร้างไฟล์ของวันนี้
    ======================================================== */

    else{

      fileHandle =
        await backupFolderHandle
          .getFileHandle(

            fileName,

            {
              create:true
            }

          );


      const csvText =

        "\uFEFF" +

        createCSVHeader() +

        "\r\n" +

        createCSVRow(
          scanData
        ) +

        "\r\n";


      const writable =
        await fileHandle
          .createWritable();


      await writable.write(
        csvText
      );


      await writable.close();


      setBackupStatus(

        "✅ สร้างไฟล์ Backup วันนี้ → " +

        fileName,

        "ok"

      );


      return true;

    }

  }

  catch(error){

    console.error(
      "Backup Error:",
      error
    );


    setBackupStatus(

      "❌ Backup ไม่สำเร็จ: " +

      error.message,

      "error"

    );


    return false;

  }

}


/* ============================================================
   BACKUP INFO
============================================================ */

function showBackupInfo(){

  if(
    !backupFolderHandle
  ){

    alert(

      "ยังไม่ได้ตั้งค่า Backup\n\n" +

      "กรุณากดปุ่ม\n" +

      "📁 ตั้งค่า Backup C:\\Count stock"

    );

    return;

  }


  alert(

    "📁 Backup Folder\n\n" +

    "Count stock\n\n" +

    "📄 ไฟล์วันนี้\n\n" +

    getDailyFileName() +

    "\n\n" +

    "ทุก Scan จะเพิ่มข้อมูลต่อท้ายไฟล์เดิม"

  );

}


/* ============================================================
   SCAN EVENT
============================================================ */

qr.addEventListener(

  "keypress",

  async function(e){

    if(
      e.key === "Enter"
    ){

      const value =
        qr.value;


      qr.value = "";


      await scan(
        value
      );

    }

  }

);


/* ============================================================
   SCAN FUNCTION
============================================================ */

async function scan(v){

  document
    .getElementById(
      "duplicateAlert"
    )
    .style.display =
    "none";


  /* ==========================================================
     EMPTY
  ========================================================== */

  if(
    !v ||
    !v.trim()
  ){

    qr.focus();

    return;

  }


  v =
    v.trim();


  /* ==========================================================
     DUPLICATE QR
  ========================================================== */

  if(
    scanned.includes(v)
  ){

    document
      .getElementById(
        "duplicateAlert"
      )
      .style.display =
      "block";


    qr.focus();

    return;

  }


  /* ==========================================================
     QR FORMAT
     
     ตัวอย่าง:
     
     200073973|A|QC FACT 1|22|VG79N625H01|212|
     2608323106aad848411f|9100003592|112|
     
     [0] Production Order
     [1] Line
     [2] Location
     [3] Seq
     [4] Part
     [5] Q'ty
     [6] Reference
     [7] PO
     [8] PO ITEM
  ========================================================== */

  const d =
    v.split("|");


  const row =
    rowSelect.value;


  latestRowFocus =
    row;


  const productionOrder =
    d[0] || "-";


  const line =
    d[1] || "-";


  const location =
    d[2] || "-";


  const seq =
    d[3] || "-";


  const part =
    d[4] || "-";


  const qty =
    parseInt(
      d[5],
      10
    ) || 0;


  const po =
    d[7] || "-";


  const poItem =
    d[8] || "-";


  const time =
    getDisplayDateTime();


  /* ==========================================================
     DUPLICATE PART REMARK
  ========================================================== */

  let duplicateRows = [];


  data.forEach(
    item => {

      if(

        item.part === part &&

        item.row !== row &&

        !duplicateRows.includes(
          item.row
        )

      ){

        duplicateRows.push(
          item.row
        );

      }

    }
  );


  let remark = "";


  if(
    duplicateRows.length > 0
  ){

    remark =

      "ข้อมูล Part item ซ้ำกับแถว " +

      duplicateRows.join(", ");

  }


  /* ==========================================================
     CREATE DATA
  ========================================================== */

  const scanData = {

    row:
      row,

    no:
      data.length + 1,

    productionOrder:
      productionOrder,

    seq:
      seq,

    line:
      line,

    location:
      location,

    part:
      part,

    qty:
      qty,

    po:
      po,

    poItem:
      poItem,

    remark:
      remark,

    time:
      time,

    key:
      v

  };


  /* ==========================================================
     SAVE DATA
  ========================================================== */

  scanned.push(
    v
  );


  data.push(
    scanData
  );


  /* ==========================================================
     RENDER
  ========================================================== */

  render();


  /* ==========================================================
     AUTO BACKUP
  ========================================================== */

  await backupScan(
    scanData
  );


  qr.focus();

}


/* ============================================================
   RENDER MAIN TABLE
     
   Q'ty ยังคงแสดง
============================================================ */

function render(){

  tb.innerHTML = "";


  data.forEach(
    (x,i) => {

      tb.innerHTML += `

        <tr
          class="${
            i === data.length - 1
            ? "latest"
            : ""
          }"
        >

          <td>
            ${escapeHtml(x.row)}
          </td>


          <td>
            ${i + 1}
          </td>


          <td>
            ${escapeHtml(
              x.productionOrder
            )}
          </td>


          <td>
            ${escapeHtml(
              x.seq
            )}
          </td>


          <td>
            ${escapeHtml(
              x.line
            )}
          </td>


          <td>
            ${escapeHtml(
              x.location
            )}
          </td>


          <td>
            ${escapeHtml(
              x.part
            )}
          </td>


          <!-- ==================================================
               Q'ty ต้องแสดงที่หน้าเว็บ
          ================================================== -->

          <td
            style="
              text-align:center;
              font-weight:bold;
            "
          >

            ${escapeHtml(
              x.qty
            )}

          </td>


          <td>
            ${escapeHtml(
              x.po
            )}
          </td>


          <td>
            ${escapeHtml(
              x.poItem
            )}
          </td>


          <td>
            ${escapeHtml(
              x.remark
            )}
          </td>


          <td>
            ${escapeHtml(
              x.time
            )}
          </td>


          <td>

            <button
              class="del-btn"
              onclick="del(${i})"
            >
              Delete
            </button>

          </td>

        </tr>

      `;

    }
  );


  /* ==========================================================
     AUTO SCROLL
  ========================================================== */

  const tableBox =
    document.querySelector(
      ".table-container"
    );


  if(tableBox){

    tableBox.scrollTop =
      tableBox.scrollHeight;

  }


  /* ==========================================================
     SUMMARY
  ========================================================== */

  renderSummary();

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   DELETE
============================================================ */

function del(i){

  if(
    i < 0 ||
    i >= data.length
  ){

    return;

  }


  const confirmed =
    confirm(

      "⚠️ ต้องการลบรายการนี้หรือไม่?\n\n" +

      "ข้อมูลจะถูกลบออกจากหน้าเว็บ\n\n" +

      "Backup CSV เดิมจะไม่ถูกลบ"

    );


  if(!confirmed){

    return;

  }


  scanned =
    scanned.filter(

      x =>
        x !== data[i].key

    );


  data.splice(
    i,
    1
  );


  render();


  qr.focus();

}


/* ============================================================
   SUMMARY PAGE
     
     สำคัญที่สุด:
     
     ตรงนี้ "ไม่มี Q'ty column"
     
     มีเพียง:
     
     Part
     Unit
     Total Q'ty
     
     Total Q'ty = Unit × Q'ty
============================================================ */

function renderSummary(){

  let summaryData = {};


  /* ==========================================================
     GROUP BY ROW + PART
  ========================================================== */

  data.forEach(
    x => {

      const row =
        String(
          x.row
        );


      const part =
        String(
          x.part || "-"
        ).trim();


      if(
        !summaryData[row]
      ){

        summaryData[row] = {};

      }


      if(
        !summaryData[row][part]
      ){

        summaryData[row][part] = {

          unit:
            0,

          totalQty:
            0

        };

      }


      /* ======================================================
         UNIT
         
         จำนวนครั้งที่ Part ถูก Scan
      ====================================================== */

      summaryData[row][part]
        .unit++;


      /* ======================================================
         TOTAL Q'TY
         
         รวม Q'ty จากทุก Scan
         
         เช่น:
         
         Scan 212
         Scan 212
         Scan 212
         
         Unit = 3
         
         Total Q'ty = 212 × 3 = 636
      ====================================================== */

      summaryData[row][part]
        .totalQty +=

        Number(
          x.qty
        ) || 0;

    }
  );


  /* ==========================================================
     EMPTY
  ========================================================== */

  if(
    Object.keys(
      summaryData
    ).length === 0
  ){

    document
      .getElementById(
        "summary"
      )
      .innerHTML =
      "";

    return;

  }


  /* ==========================================================
     BUILD SUMMARY HTML
     
     ไม่มี Q'ty column
  ========================================================== */

  let html = "";


  Object.keys(
    summaryData
  )

  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )

  .forEach(
    r => {

      let totalUnit =
        0;


      let totalQty =
        0;


      html += `

        <div
          class="
            summary-box
            ${
              latestRowFocus == r
              ? "summary-focus"
              : ""
            }
          "
        >

          <div
            class="summary-title"
          >

            📍 Row ${escapeHtml(r)}

          </div>


          <table>


            <thead>

              <tr>

                <th>
                  Part
                </th>


                <th>
                  Unit
                </th>


                <th>
                  Total Q'ty
                </th>

              </tr>

            </thead>


            <tbody>

      `;


      /* ======================================================
         PART SUMMARY
      ====================================================== */

      Object.keys(
        summaryData[r]
      )

      .forEach(
        p => {

          const unit =
            summaryData[r][p]
              .unit;


          const partTotalQty =
            summaryData[r][p]
              .totalQty;


          totalUnit +=
            unit;


          totalQty +=
            partTotalQty;


          html += `

            <tr>

              <td>
                ${escapeHtml(p)}
              </td>


              <td
                style="
                  text-align:center;
                "
              >

                ${unit}

              </td>


              <td
                style="
                  text-align:center;
                  font-weight:bold;
                "
              >

                ${partTotalQty}

              </td>

            </tr>

          `;

        }
      );


      /* ======================================================
         TOTAL
      ====================================================== */

      html += `

            </tbody>


            <tfoot>

              <tr>

                <td>

                  <b>
                    TOTAL
                  </b>

                </td>


                <td
                  style="
                    text-align:center;
                  "
                >

                  <b>
                    ${totalUnit}
                  </b>

                </td>


                <td
                  style="
                    text-align:center;
                    font-weight:bold;
                  "
                >

                  <b>
                    ${totalQty}
                  </b>

                </td>

              </tr>

            </tfoot>


          </table>


        </div>

      `;

    }
  );


  /* ==========================================================
     DISPLAY SUMMARY
  ========================================================== */

  document
    .getElementById(
      "summary"
    )
    .innerHTML =
    html;

}

/* ============================================================
   EXPORT EXCEL
     
     Q'ty ยังคงอยู่ทั้ง RawData และ Summary Excel
============================================================ */

function exportExcel(){

  if(
    data.length === 0
  ){

    alert(
      "ยังไม่มีข้อมูลสำหรับ Export Excel"
    );

    qr.focus();

    return;

  }


  /* ==========================================================
     CREATE WORKBOOK
  ========================================================== */

  const wb =
    XLSX.utils.book_new();


  /* ==========================================================
     RAW DATA
     
     Q'ty ยังคงอยู่
  ========================================================== */

  const rawData =
    data.map(
      (x,i) => ({

        Row:
          x.row,

        No:
          i + 1,

        "Production Order":
          x.productionOrder,

        Seq:
          x.seq,

        Line:
          x.line,

        Location:
          x.location,

        Part:
          x.part,

        "Q'ty":
          Number(x.qty) || 0,

        PO:
          x.po,

        "PO ITEM":
          x.poItem,

        Remark:
          x.remark,

        Time:
          x.time

      })
    );


  /* ==========================================================
     RAW WORKSHEET
  ========================================================== */

  const ws1 =
    XLSX.utils.json_to_sheet(
      rawData
    );


  /* ==========================================================
     RAW HEADER STYLE
  ========================================================== */

  if(ws1["!ref"]){

    const range =
      XLSX.utils.decode_range(
        ws1["!ref"]
      );


    for(
      let C = range.s.c;
      C <= range.e.c;
      C++
    ){

      const addr =
        XLSX.utils.encode_cell({

          r:0,

          c:C

        });


      if(
        ws1[addr]
      ){

        ws1[addr].s = {

          font:{

            bold:true,

            color:{
              rgb:"FFFFFF"
            }

          },

          fill:{

            fgColor:{
              rgb:"4472C4"
            }

          },

          alignment:{

            horizontal:
              "center",

            vertical:
              "center"

          }

        };

      }

    }

  }


  /* ==========================================================
     RAW COLUMN WIDTH
  ========================================================== */

  ws1["!cols"] = [

    {wch:8},

    {wch:8},

    {wch:20},

    {wch:8},

    {wch:12},

    {wch:20},

    {wch:28},

    {wch:12},

    {wch:18},

    {wch:15},

    {wch:35},

    {wch:22}

  ];


  XLSX.utils.book_append_sheet(

    wb,

    ws1,

    "RawData"

  );


  /* ==========================================================
     SUMMARY DATA
     
     Excel Summary ยังคงมี Q'ty
     
     Row
     Part
     Unit
     Q'ty
     Total Q'ty
     
     ดังนั้น Q'ty ไม่ได้ถูกลบออกจาก Excel
  ========================================================== */

  let summaryData = {};


  data.forEach(
    x => {

      const row =
        String(
          x.row
        );


      const part =
        String(
          x.part || "-"
        ).trim();


      if(
        !summaryData[row]
      ){

        summaryData[row] = {};

      }


      if(
        !summaryData[row][part]
      ){

        summaryData[row][part] = {

          unit:
            0,

          qty:
            0,

          totalQty:
            0

        };

      }


      /* ======================================================
         UNIT
      ====================================================== */

      summaryData[row][part]
        .unit++;


      /* ======================================================
         Q'TY
         
         เก็บ Qty จริงไว้ใน Excel
      ====================================================== */

      const currentQty =
        Number(
          x.qty
        ) || 0;


      summaryData[row][part]
        .qty +=
        currentQty;


      /* ======================================================
         TOTAL QTY
      ====================================================== */

      summaryData[row][part]
        .totalQty +=
        currentQty;

    }
  );


  /* ==========================================================
     BUILD EXCEL SUMMARY
     
     Q'ty ยังคงแสดง
  ========================================================== */

  let summarySheet = [];


  Object.keys(
    summaryData
  )

  .sort(
    (a,b) =>
      Number(a) -
      Number(b)
  )

  .forEach(
    r => {

      let totalUnit =
        0;


      let totalQty =
        0;


      Object.keys(
        summaryData[r]
      )

      .forEach(
        p => {

          const unit =
            summaryData[r][p]
              .unit;


          const qty =
            summaryData[r][p]
              .qty;


          const totalPartQty =
            summaryData[r][p]
              .totalQty;


          totalUnit +=
            unit;


          totalQty +=
            totalPartQty;


          summarySheet.push({

            Row:
              r,

            Part:
              p,

            Unit:
              unit,

            "Q'ty":
              qty,

            "Total Q'ty":
              totalPartQty

          });

        }
      );


      /* ======================================================
         TOTAL
      ====================================================== */

      summarySheet.push({

        Row:
          r,

        Part:
          "TOTAL",

        Unit:
          totalUnit,

        "Q'ty":
          totalQty,

        "Total Q'ty":
          totalQty

      });

    }
  );


  /* ==========================================================
     SUMMARY WORKSHEET
  ========================================================== */

  const ws2 =
    XLSX.utils.json_to_sheet(
      summarySheet
    );


  /* ==========================================================
     SUMMARY STYLE
  ========================================================== */

  if(ws2["!ref"]){

    const range =
      XLSX.utils.decode_range(
        ws2["!ref"]
      );


    for(
      let R = range.s.r;
      R <= range.e.r;
      R++
    ){

      for(
        let C = range.s.c;
        C <= range.e.c;
        C++
      ){

        const addr =
          XLSX.utils.encode_cell({

            r:R,

            c:C

          });


        const cell =
          ws2[addr];


        if(!cell){

          continue;

        }


        /* ----------------------------------------------------
           HEADER
        ---------------------------------------------------- */

        if(R === 0){

          cell.s = {

            font:{

              bold:true,

              color:{
                rgb:"FFFFFF"
              }

            },

            fill:{

              fgColor:{
                rgb:"4472C4"
              }

            },

            alignment:{

              horizontal:
                "center",

              vertical:
                "center"

            }

          };

        }


        /* ----------------------------------------------------
           TOTAL ROW
        ---------------------------------------------------- */

        const partCell =
          ws2[
            XLSX.utils.encode_cell({

              r:R,

              c:1

            })
          ];


        if(

          partCell &&

          partCell.v === "TOTAL"

        ){

          for(
            let C2 = 0;
            C2 <= 4;
            C2++
          ){

            const totalAddr =
              XLSX.utils.encode_cell({

                r:R,

                c:C2

              });


            if(
              ws2[totalAddr]
            ){

              ws2[totalAddr].s = {

                font:{

                  bold:true

                },

                fill:{

                  fgColor:{
                    rgb:"B7DEE8"
                  }

                }

              };

            }

          }

        }

      }

    }

  }


  /* ==========================================================
     NUMBER FORMAT
  ========================================================== */

  if(ws2["!ref"]){

    const range =
      XLSX.utils.decode_range(
        ws2["!ref"]
      );


    for(
      let R = 1;
      R <= range.e.r;
      R++
    ){

      for(
        let C = 2;
        C <= 4;
        C++
      ){

        const addr =
          XLSX.utils.encode_cell({

            r:R,

            c:C

          });


        if(

          ws2[addr] &&

          typeof ws2[addr].v ===
            "number"

        ){

          ws2[addr].z =
            "#,##0";

        }

      }

    }

  }


  /* ==========================================================
     SUMMARY COLUMN WIDTH
  ========================================================== */

  ws2["!cols"] = [

    {wch:10},

    {wch:28},

    {wch:12},

    {wch:12},

    {wch:18}

  ];


  /* ==========================================================
     APPEND SUMMARY
  ========================================================== */

  XLSX.utils.book_append_sheet(

    wb,

    ws2,

    "Summary"

  );


  /* ==========================================================
     EXCEL FILE NAME
  ========================================================== */

  const fileName =

    "Stock Counting_" +

    getDateString() +

    "_Export.xlsx";


  /* ==========================================================
     DOWNLOAD
  ========================================================== */

  XLSX.writeFile(

    wb,

    fileName

  );


  setBackupStatus(

    "✅ Export Excel สำเร็จ → " +

    fileName,

    "ok"

  );


  qr.focus();

}


/* ============================================================
   INITIAL STATUS
============================================================ */

if(
  !isBackupSupported()
){

  setBackupStatus(

    "⚠ Browser ไม่รองรับ Auto Backup ลง C:\\ กรุณาใช้ Google Chrome หรือ Microsoft Edge รุ่นใหม่",

    "error"

  );

}
else{

  setBackupStatus(

    "⚠ กรุณากด 'ตั้งค่า Backup C:\\Count stock' ก่อน Scan",

    ""

  );

}


/* ============================================================
   INITIAL FOCUS
============================================================ */

qr.focus();


</script>
